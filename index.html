<!-- ACE Fire LA — Job Dashboard · v0.64 — comment accuracy only (no behavior change): the two inline comments flagged in review now describe current behavior — the card pick comes from P.custLatest (not CU[0]/dedupe), and the \u201cCustomer on file\u201d label applies to a SELECTED undated row, of which there are currently zero. Plus v0.63 — comment accuracy only (no behavior change from v0.62): the labelling claim now states what the UI does per CARD rather than per relationship. Plus v0.62 — the latest-customer claim is now backed by data: valid_from was backfilled on 551 of 562 frozen customer relationships from the newest linked Wix quote per customer (evidence table wix_quote_customers, checksum-verified against the export), the query orders valid_from DESC nulls-last with customer_name ASC as a deterministic tiebreak, the card picks the RAW first row (newest spelling, never dedupe's older variant), and a selected customer without a date is labelled \u201cCustomer on file\u201d instead of \u201cLatest customer\u201d (after the backfill, zero cards are actually affected \u2014 all 11 undated rows are non-selected variants; the label is the honest fallback). Plus v0.61 — the property card's top-right slot now shows the LATEST client name (mechanics superseded in v0.62: the pick is P.custLatest from the raw server-ordered rows, not dedupe output) instead of the freeze grade chips, which were provenance rather than action \u2014 they remain in the detail view next to Address check, and the one actionable grade, \u201cneeds review\u201d, still shows its chip on the list. Plus v0.60 — nested-transition fix from review: tapping a record in Change History while a property detail is open underneath no longer switches main tabs (the tab switch fired leaveDetail's history.back() between beginReplace and the drawer's open, recreating the queued-traversal race); the drawer now opens over the property — stack [propsel, drawer] — so Back closes the drawer and returns to the property naturally. All other paths unchanged. Plus v0.59 — race-free surface transitions: history.back() is a QUEUED async traversal, so the close-then-push pattern in drawer\u2192property, unread-popover\u2192drawer and change-history\u2192drawer could let the queued traversal pop the freshly pushed entry and desync the stack (the next Back would leave the app). BackNav.beginReplace() now closes the outgoing surface without queuing anything and the incoming open() reuses the entry via synchronous history.replaceState() at the same depth \u2014 nothing queued, nothing to race. Call sites guard on the target surface not already being open. The navigation harness models Back asynchronously (queued traversals + flush) as review required. Plus v0.58 — back-navigation stack fixes from review: one centralized leaveDetail() owns every exit from the property detail (property Back button, filter chips, and all main-tab navigation via a renderContent hook), clearing the selection AND consuming the propsel history entry so nothing stale survives a tab switch; the popstate closer is defensive (no-ops when nothing is selected, re-renders only when Properties is active); and propOpen() invoked from an open record drawer closes the drawer first, so the history stack matches the screen and one Back press does what it looks like it should. Plus v0.57 — job briefs and a working back button: Tracker rows show a compact 2-3 word chip of what the job is (system + kind, e.g. \u201cSprinkler annual\u201d, \u201cAlarm repair\u201d) derived from the title; and BackNav gives every overlay (record drawer, email/text composers, thread, change history, unread popover) and the property detail one history entry, so the hardware/browser back button closes the topmost open surface instead of leaving the page \u2014 leaving was what read as \u201cback logs me out\u201d, since the memory-only Sheets token forces the sign-in gate on return. Surfaces closed by their own X consume their entry; with nothing open, back exits normally. Plus v0.56 — comment hygiene only: the historical v0.54 portion of this comment now scopes address checks to teammates with Properties access; no behavior changes from v0.55. Plus v0.55 — review fixes on the address-check flow: the section renders ONLY when the property_reviews dataset actually loaded (P.reviewsOk), so a failed optional query hides the buttons instead of inviting a doomed submit; wording corrected — checks are scoped to any signed-in teammate with Properties access (Field accounts never see the layer); and the reviewer receives the RLS/grant evidence in the bundle: SELECT + INSERT to authenticated only, INSERT pinned server-side to the JWT email, no UPDATE/DELETE policies or grants, anon fully revoked. Plus v0.54 — phone-friendly property cards (the row wraps on \u2264640px: id + alert + chip on the top line, full-width wrapping title below, no more mid-address ellipsis) and teammate address checks: every property detail has an Address check section where any signed-in teammate with Properties access can Confirm the grouping or Flag a problem with a note; verdicts land in the insert-only property_reviews table (reviewer pinned to the JWT email, no edits or deletes) and are folded into the frozen grades periodically through the controlled freeze workflow. Loaded as the optional eighth dataset with the same failure isolation as the chip table. Plus v0.53 — final containment edge: the popover's height cap is the actual nonnegative space on the chosen side with no imposed minimum (the old 120px floor could push it past the viewport bottom in very short viewports); in a tiny viewport the list simply gets short and scrolls. Plus v0.52 — popover review fixes: the unread list is now vertically contained (it fits below the pill only when there's room, capping its height to the space that exists, and flips above the pill with the same cap otherwise — it never extends past the viewport), and archived rows are plain containers holding the Mark-read button, so no button nests inside another. Plus v0.51 — the team-message pill works: it now has its own styling scaled to the dark attention bar (it borrowed the stats-grid look before), and clicking it opens an unread list where every row does something — threads on active records open their drawer, threads on archived records are labelled "(archived)" with a Mark-read button (the old handler silently did nothing for these, which is why the pill felt dead), plus Mark all read. The popover closes on outside click, Escape, or scroll. Plus v0.50 — confidence chips in plain language: the freeze grades (high / probable / ambiguous / resolved_split / multi_address_unsplit) now render as "address verified", "address probable", "needs review", "split property" and "multi-building", each with a title-attribute explanation; colors and stored values are unchanged. Plus v0.49 — failure isolation for the chip table: the six core property datasets stay load-fatal, but an error from the optional property_systems query (missing table, late migration, RLS misconfiguration) now only logs a warning and leaves the persistent set empty — the layer comes up and live workbook-derived chips keep working, exactly as v0.47 did. Plus v0.48 — persistent system chips: a precomputed property_systems table in Supabase (built server-side from linked quote/tracker titles PLUS Ember appointment system data, additive across refreshes) is loaded as the seventh property dataset and unioned with the live in-browser derivation — so chips no longer depend on the evidence rows still existing in the workbook. Coverage jumps from the handful of properties whose titles happen to be loaded to every property with classified history (137 today; the pre-mirror historical titles are a pending one-time seed backfill). Plus v0.47 — role resolution now requires a FRESH Roles response: cache hydration shapes the UI but never authorizes the property layer (a demotion since the last visit takes effect before any data moves), and a failed Roles read no longer resolves — only a successful response, or the tab's confirmed absence (Google 400 "Unable to parse range", the legacy open-roster case), sets rolesResolved. Network, auth and quota failures keep the layer closed. Plus v0.46 — review fixes on the property layer: the layer now fails CLOSED until the Roles roster has actually been read (state.rolesResolved), so a saved Supabase session can no longer pull the six property datasets before a Field role is established — every exported accessor is gated and the load starts only on the roster-resolved signal (server-side RLS remains tracked as role-enforcement Phase 2). System chips now read the archives too — Archive (paid jobs) and Quotes Archive (expired quotes) — because 290 properties have system evidence only in historical titles; and the classifier catches "Central Station" (Alarm), "Back Flow", hyphenated Fire-Pump/Stand-pipe, while "double check" only counts with a device word after it. Plus v0.45 — system types on Properties: each property shows chips for the systems on site (Sprinkler / Alarm / Backflow / Hydrant / Fire pump / Standpipe / Extinguisher), derived read-only from the titles of its linked quote and tracker records, in the list, in the detail view, and in property search (typing "backflow" filters the list). Nothing is written to the frozen layer; a property whose titles name no system shows no chips. Plus v0.44 — safe-area follow-ups from review: the sticky-tab watcher is guarded while #app is hidden and refreshed the moment sign-in reveals it, the toast subtracts the left/right insets from its width, and the loading bar sits below the notch instead of top:0. Plus v0.43 — complete iOS safe-area coverage: the sticky tab bar pins below the status bar (a painted backdrop strip while stuck keeps page content from scrolling through the notch band), and every fixed surface — record drawer, change-history panel, full-screen email/SMS/thread dialogs — insets for the notch, rounded corners and home indicator, including the ≥900px overrides that previously stripped those insets (the desktop .d-foot override was dropping the home-indicator padding). Plus v0.42 safe-area page containers and v0.41 installable web app: PNG icons at 192/512 (plus maskable), manifest generated at runtime with ABSOLUTE start_url/scope/id, iOS safe-area insets, no orientation lock. Earlier — tab icon and installable home-screen app (embedded, still one file) — "Unlinked" queue on Properties: records with no property are listed with a suggested match, so linking an existing site or spotting a genuinely new one is a glance rather than an audit. Plus v0.37 — Tracker quote numbers arrive comma-formatted ("1,242"), so property matching now strips separators: Tracker chips go from 69 to 145 of 148 rows. Plus v0.36 Properties wide-screen layout (list becomes a responsive grid, detail splits into two columns on a wide monitor) on top of v0.35 phase 2: every quote/tracker row that maps to a frozen property shows its P-number, and tapping it opens that property. The drawer shows the property and address for the open record. Chips are hidden from Field accounts, which cannot open Properties. Read-only: the frozen layer (P-0001…P-0501) is never written from here. -->

<style>
:root{
  --ink:#181A1F; --ink2:#3C4048; --muted:#767B85;
  --paper:#F5F4F1; --card:#FFFFFF; --line:#E4E2DC; --line2:#D5D2CA;
  --red:#C4322E; --red-dk:#9E2724; --red-bg:#FBEDEC;
  --amber:#B26A00; --amber-bg:#FCF3E3;
  --green:#2E7D4F; --green-bg:#EAF4EE;
  --blue:#2B5FA3; --blue-dk:#234E87; --blue-bg:#EBF1F9;
  --radius:10px;
  /* v0.42 — iOS safe-area insets, defined once and consumed by every
     full-width container at every breakpoint. Defining them here (rather than
     inlining env() per rule) is what stops a later media query from silently
     dropping notch protection, which is exactly what happened in v0.41 where
     the 900px block replaced the header padding outright.
     env() is 0 in a normal browser tab, so this is inert outside the
     installed iOS app. v0.43 extends consumption to the sticky tab bar and
     every fixed panel (drawer, history, dialogs) — see the appended
     max-width:640px block near the end of this sheet. */
  --sa-t:env(safe-area-inset-top, 0px);
  --sa-r:env(safe-area-inset-right, 0px);
  --sa-b:env(safe-area-inset-bottom, 0px);
  --sa-l:env(safe-area-inset-left, 0px);
  --shadow:0 1px 2px rgba(20,22,26,.06), 0 4px 14px rgba(20,22,26,.05);
  --drawer-w:460px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--paper); color:var(--ink); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
body.drawer-open{overflow:hidden}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:4px}
.row:focus-visible{outline-offset:-2px}
.visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* ============ Header (scrolls away; tabs stay sticky) ============ */
header{background:var(--ink); color:#fff}
/* Installed on iOS the app runs full-bleed under a translucent status
   bar (viewport-fit=cover + black-translucent), so the header must inset itself
   or the brand sits under the notch. env() is 0 in a normal browser tab, so
   this costs nothing there. */
.hd-inner{
  max-width:none; margin:0 auto;
  padding:calc(10px + var(--sa-t)) calc(16px + var(--sa-r)) 10px calc(16px + var(--sa-l));
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:8px; margin-right:auto}
h1.ace{font-family:'Barlow Condensed'; font-weight:700; font-size:24px; letter-spacing:.04em; text-transform:uppercase; margin:0}
h1.ace b{color:#E8534E; font-weight:700}
.brand .sub{font-family:'Barlow Condensed'; font-weight:500; font-size:15px; letter-spacing:.14em; text-transform:uppercase; color:#9BA0AB}
.hd-user{display:flex; align-items:center; gap:10px; font-size:12.5px; color:#C6CAD2}
.hd-inner .email{max-width:170px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#C6CAD2; font-size:12.5px; align-self:center}
.hd-inner .email.switchable{cursor:pointer; text-decoration:underline dotted 1px; text-underline-offset:3px}
.hd-btn{
  background:transparent; border:1px solid #464B55; color:#E8EAEE;
  border-radius:8px; padding:7px 12px; font-size:12.5px; font-weight:600; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px; min-height:38px;
}
.hd-btn:hover{background:#262A31; border-color:#5A5F6A}
.hd-btn.spin svg{animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.brand .ver{font-family:'Inter'; font-size:10.5px; font-weight:600; color:#9BA0AB; border:1px solid #464B55; border-radius:99px; padding:2px 8px; align-self:center}
.gate-card .ver{display:block; font-size:11px; color:var(--muted); margin-top:4px}
.stripe{height:6px; background:repeating-linear-gradient(-45deg, var(--red) 0 14px, var(--ink) 14px 28px)}

/* ============ Attention bar + KPI cards ============ */
.summary{max-width:none; margin:0 auto; padding:12px calc(16px + var(--sa-r)) 4px calc(16px + var(--sa-l))}
.attn{
  background:var(--ink); color:#DDE0E6; border-radius:12px;
  padding:10px 16px; display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  box-shadow:var(--shadow);
}
.attn .tag{
  display:flex; align-items:center; gap:8px; font-family:'Barlow Condensed';
  font-weight:700; font-size:14.5px; letter-spacing:.13em; text-transform:uppercase; color:#fff;
}
.attn .dot{width:8px; height:8px; border-radius:50%; background:#E8534E; box-shadow:0 0 0 3px rgba(232,83,78,.25)}
.attn button.stat{
  appearance:none; border:none; background:none; color:#C9CDD5; font:inherit; font-size:13px;
  display:flex; align-items:baseline; gap:6px; cursor:pointer; padding:2px 0;
}
.attn button.stat b{font-family:'Barlow Condensed'; font-weight:700; font-size:19px; line-height:1}
.attn button.stat:hover{color:#fff; text-decoration:underline}
.attn .s-red b{color:#F0716C}
.attn .s-amber b{color:#EFB35A}
.kpis{display:none; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:10px; margin-top:10px}
.kpis.open{display:grid}
.statsbtn{
  display:inline-flex; appearance:none; border:1px solid #464B55; background:transparent; color:#C9CDD5;
  border-radius:8px; padding:5px 10px; font-size:11.5px; font-weight:700; cursor:pointer;
  margin-left:auto; white-space:nowrap; flex:none;
}
.kpi{
  appearance:none; font:inherit; cursor:pointer; text-align:left;
  background:var(--card); border:1px solid var(--line); border-left-width:4px; border-radius:12px;
  padding:12px 14px 11px; box-shadow:var(--shadow);
}
.kpi .lbl{font-family:'Barlow Condensed'; font-weight:700; font-size:13.5px; letter-spacing:.12em; text-transform:uppercase}
.kpi b{display:block; font-family:'Barlow Condensed'; font-weight:700; font-size:34px; line-height:1.05; margin:2px 0 1px}
.kpi .sub{font-size:11.5px; color:var(--muted)}
.kpi.t-red{border-left-color:var(--red)} .kpi.t-red .lbl, .kpi.t-red b{color:var(--red-dk)}
.kpi.t-amber{border-left-color:#E0A93E} .kpi.t-amber .lbl, .kpi.t-amber b{color:var(--amber)}
.kpi.t-blue{border-left-color:var(--blue)} .kpi.t-blue .lbl, .kpi.t-blue b{color:var(--blue)}
.kpi.zero{opacity:.6}
.kpi.zero b{color:var(--muted)}
.kpi.active{outline:2px solid var(--ink); outline-offset:-1px}

/* ============ Today's Priorities (AI) ============ */
.prio-when{font-size:11.5px; color:#9BA0AB; white-space:nowrap; margin-left:2px}
.prio-refresh{
  appearance:none; border:1px solid #464B55; background:transparent; color:#C9CDD5;
  border-radius:8px; padding:5px 10px; font-size:11.5px; font-weight:700; cursor:pointer;
  display:inline-flex; align-items:center; gap:5px; white-space:nowrap; flex:none;
}
.prio-refresh:hover{background:#262A31; color:#fff}
.prio-refresh:disabled{opacity:.6; cursor:default}
.prio-refresh.spin svg{animation:rot 1s linear infinite}
.prios{display:flex; flex-direction:column; gap:8px; margin-top:10px}
.prio{
  appearance:none; font:inherit; cursor:pointer; text-align:left; width:100%;
  background:var(--card); border:1px solid var(--line); border-left-width:4px; border-radius:12px;
  padding:11px 13px; box-shadow:var(--shadow); display:flex; align-items:flex-start; gap:11px;
}
.prio:hover{border-color:#C7CBD3}
.prio .pbadge{
  flex:none; width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  font-family:'Barlow Condensed'; font-weight:700; font-size:16px; color:#fff; margin-top:1px;
}
.prio.p1{border-left-color:var(--red)}  .prio.p1 .pbadge{background:var(--red)}
.prio.p2{border-left-color:#E0A93E}     .prio.p2 .pbadge{background:#E0A93E}
.prio.p3{border-left-color:var(--blue)} .prio.p3 .pbadge{background:var(--blue)}
.prio .pbody{display:flex; flex-direction:column; gap:2px; min-width:0}
.prio .ptrow{display:flex; align-items:baseline; gap:7px; min-width:0}
.prio .pkey{font-family:'Barlow Condensed'; font-weight:700; font-size:14.5px; color:var(--muted); flex:none; letter-spacing:.03em}
.prio .pt{font-weight:600; font-size:14px; line-height:1.3}
.prio .why{font-size:12px; color:var(--muted); line-height:1.4}
.prio .act{font-size:12px; color:var(--blue); font-weight:600; margin-top:1px}
.prio .pright{margin-left:auto; align-self:center; display:flex; align-items:center; gap:8px; flex:none; padding-left:6px}
.pchip{font-size:11px; font-weight:700; color:var(--muted); background:var(--paper); border:1px solid var(--line); border-radius:99px; padding:3px 9px; white-space:nowrap}
.pdone{
  appearance:none; cursor:pointer; width:26px; height:26px; border-radius:50%; flex:none;
  border:1.5px solid var(--line); background:none; color:var(--muted); font-size:13px; line-height:1;
  display:flex; align-items:center; justify-content:center;
}
.pdone:hover{border-color:var(--blue); color:var(--blue)}
.prio .go{align-self:center; color:var(--muted); font-size:20px; flex:none}
.prio-empty{
  background:var(--card); border:1px dashed var(--line); border-radius:12px;
  padding:14px; font-size:12.5px; color:var(--muted); text-align:center;
}
@media (max-width:640px){
  .prios{gap:7px}
  .prio{padding:10px 11px}
  .prio .why{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .pchip{display:none}
}
@media (min-width:900px){
  .prios{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .prios .prio:first-child{grid-column:1 / -1}
  .prio-empty{grid-column:1 / -1}
}

/* ============ Tabs (sticky) ============ */
/* v0.43 — the header scrolls away, so the tabs must pin BELOW the iOS status
   bar, not under it. While pinned (class toggled by the stuck-watcher in the
   main script), ::before paints a card-coloured strip over the status-bar
   band so page content can't scroll through it. --sa-t is 0 in a normal
   browser tab, so both rules are inert on desktop. */
nav.tabs{background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:var(--sa-t, 0px); z-index:45;
  padding-left:var(--sa-l); padding-right:var(--sa-r)}
nav.tabs.stuck::before{
  content:""; position:absolute; left:0; right:0; bottom:100%; height:var(--sa-t, 0px);
  background:var(--card);
}
.tabs-inner{max-width:none; margin:0 auto; padding:0 8px; display:flex; gap:2px; align-items:center}
.tab{
  appearance:none; background:none; border:none; cursor:pointer;
  font-family:'Barlow Condensed'; font-weight:600; font-size:19px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--muted);
  padding:13px 18px 11px; border-bottom:3px solid transparent;
  display:flex; align-items:center; gap:8px; min-height:50px;
}
.tab .cnt{
  font-family:'Inter'; font-size:11px; font-weight:700; letter-spacing:0;
  background:var(--paper); color:var(--muted); border:1px solid var(--line);
  border-radius:99px; padding:1px 8px;
}
.tab.active{color:var(--ink); border-bottom-color:var(--red)}
.tab.active .cnt{background:var(--red-bg); color:var(--red-dk); border-color:#EFD2D1}
/* ============ Toolbar / filters ============ */
.toolbar{
  max-width:none; margin:0 auto; padding:12px calc(16px + var(--sa-r)) 0 calc(16px + var(--sa-l));
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
}
.search{flex:1; min-width:170px; max-width:420px; position:relative}
.search input{
  width:100%; padding:10px 12px 10px 36px; border:1px solid var(--line2); border-radius:var(--radius);
  background:var(--card); font-size:14px; outline:none;
}
.search input:focus{border-color:var(--ink2)}
.search svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none}
select.sortsel{
  border:1px solid var(--line2); border-radius:var(--radius); background:var(--card);
  padding:9px 10px; font-size:13px; color:var(--ink2); outline:none; min-height:40px; max-width:170px;
}
.stale{
  margin-left:auto; appearance:none; border:1px solid var(--line2); background:var(--card);
  border-radius:99px; padding:6px 12px; font-size:11.5px; font-weight:600; color:var(--muted);
  cursor:pointer; white-space:nowrap; min-height:34px;
}
.stale.warn{border-color:#E7C87B; background:var(--amber-bg); color:var(--amber)}
.stale.old{border-color:#EFD2D1; background:var(--red-bg); color:var(--red-dk)}
.filters{
  max-width:none; margin:0 auto; padding:10px calc(16px + var(--sa-r)) 2px calc(16px + var(--sa-l));
  display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch;
}
.fchip{
  appearance:none; border:1px solid var(--line2); background:var(--card); color:var(--ink2);
  font-size:12.5px; font-weight:600; border-radius:99px; padding:8px 14px; cursor:pointer;
  white-space:nowrap; min-height:38px; display:inline-flex; align-items:center;
}
.fchip.active{background:var(--ink); border-color:var(--ink); color:#fff}
.fchip .n{
  font-weight:700; margin-left:7px; font-size:10.5px;
  background:#F0EFEA; color:var(--muted); border-radius:99px; padding:1px 7px;
}
.fchip.active .n{background:#3A3E46; color:#E8EAEE}
.banner{max-width:none; margin:10px auto 0; padding:0 calc(16px + var(--sa-r)) 0 calc(16px + var(--sa-l)); display:none}
.banner.on{display:block}
.banner .inner{
  background:var(--amber-bg); border:1px solid #E7C87B; color:var(--amber);
  border-radius:var(--radius); padding:9px 13px; font-size:12.5px; font-weight:600;
}

/* ============ List ============ */
main{max-width:none; margin:0 auto; padding:12px calc(16px + var(--sa-r)) calc(90px + var(--sa-b)) calc(16px + var(--sa-l))}
.list{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); overflow:hidden;
}
.row{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:none; border:none; border-bottom:1px solid var(--line);
  padding:12px 14px; cursor:pointer; font:inherit; color:inherit;
}
.row:last-child{border-bottom:none}
.row:hover{background:#FAFAF8}
.row.sel{background:var(--red-bg)}
.row.u-exp{box-shadow:inset 4px 0 0 var(--red)}
.row.u-soon{box-shadow:inset 4px 0 0 #E0A93E}
.row.u-warn{box-shadow:inset 4px 0 0 #E0A93E}
.r-main{flex:1; min-width:0}
.r-top{display:flex; align-items:baseline; gap:8px; min-width:0}
.r-top .r-side{margin-left:auto; flex:none; padding-left:8px}
.r-q{font-family:'Barlow Condensed'; font-weight:700; font-size:16.5px; color:var(--ink); white-space:nowrap}
.row.u-exp .r-q{color:var(--red-dk)}
.row.u-soon .r-q{color:var(--amber)}
.row.u-closed .r-q{color:var(--muted)}
.row.u-closed .r-nm{color:var(--muted); font-weight:600}
.row.u-closed{background:#F7F6F2; box-shadow:inset 4px 0 0 var(--line2)}
.row.u-closed:hover{background:#F1F0EB}
.row.u-closed.oc-won{background:#DCEFE3; box-shadow:inset 5px 0 0 var(--green)}
.row.u-closed.oc-won:hover{background:#D0E8D9}
.row.u-closed.oc-post{background:#FAEBC4; box-shadow:inset 5px 0 0 #E0A93E}
.row.u-closed.oc-post:hover{background:#F6E3B0}
.row.u-closed.oc-red{background:#F8DEDC; box-shadow:inset 5px 0 0 var(--red)}
.row.u-closed.oc-red:hover{background:#F3D2CF}
.row.u-closed.oc-won .r-q, .row.u-closed.oc-post .r-q, .row.u-closed.oc-red .r-q{color:var(--ink)}
.row.u-closed.oc-won .r-nm, .row.u-closed.oc-post .r-nm, .row.u-closed.oc-red .r-nm{color:var(--ink)}
.row.u-closed .r-ttl, .row.u-closed .r-meta{opacity:.75}
.row.u-closed.sel{background:var(--red-bg)}
.ren-dm{display:inline-flex; gap:6px; align-items:center; flex-wrap:wrap}
.r-nm{font-weight:650; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
/* v0.57 — compact what-is-this-job chip on Tracker rows */
.r-brief{flex:none; font-size:11px; font-weight:700; letter-spacing:.25px; text-transform:uppercase; color:#4A5A6E; background:#EDF2F8; border:1px solid #D6E0EC; border-radius:7px; padding:1px 7px; white-space:nowrap}
.r-dot{width:8px; height:8px; border-radius:50%; background:var(--amber); flex:none; align-self:center}
.r-ttl{color:var(--muted); font-size:12.5px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.r-meta{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; align-items:center}
.fu{
  appearance:none; font:inherit; cursor:pointer;
  font-size:11.5px; font-weight:600; color:var(--ink2); background:#F2F1ED;
  border:1px solid transparent; border-radius:6px; padding:3px 8px;
  white-space:nowrap; font-variant-numeric:tabular-nums; min-height:26px;
}
.fu:hover{border-color:var(--line2); background:#ECEBE5}
.fu.off{color:var(--muted); background:transparent; border:1px dashed var(--line2)}
.fu.off:hover{color:var(--blue); border-color:var(--blue); border-style:solid}
.fu.busy{opacity:.5; pointer-events:none}
.fu.draft{border:1px solid #CBD9EC; border-style:solid; background:var(--blue-bg); color:var(--blue)}
.fu.draft:hover{border-color:var(--blue); background:#DEE9F6}
a.fu{text-decoration:none; display:inline-flex; align-items:center; gap:4px}
.chev{color:var(--line2); flex:none}
.row:hover .chev{color:var(--muted)}
.badge{
  display:inline-block; font-size:11.5px; font-weight:700; border-radius:6px;
  padding:2px 8px; white-space:nowrap; font-variant-numeric:tabular-nums;
}
.b-red{background:var(--red-bg); color:var(--red-dk)}
.b-amber{background:var(--amber-bg); color:var(--amber)}
.b-green{background:var(--green-bg); color:var(--green)}
.b-blue{background:var(--blue-bg); color:var(--blue)}
.b-gray{background:#EFEEEA; color:var(--ink2)}
.empty{padding:48px 20px; text-align:center; color:var(--muted); font-size:14px}

/* skeleton loading */
.skel{padding:12px 14px; border-bottom:1px solid var(--line)}
.skel i{
  display:block; height:12px; border-radius:6px; margin:6px 0;
  background:linear-gradient(90deg, #EEEDE8 25%, #F7F6F2 50%, #EEEDE8 75%);
  background-size:200% 100%; animation:shim 1.2s infinite;
}
.skel i:nth-child(1){width:45%} .skel i:nth-child(2){width:70%} .skel i:nth-child(3){width:30%}
@keyframes shim{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){ .skel i,.loading-bar i,#drawer{animation:none; transition:none} }

/* ============ Drawer ============ */
#overlay{
  position:fixed; inset:0; background:rgba(20,22,26,.45); z-index:60;
  opacity:0; pointer-events:none; transition:opacity .2s;
}
#overlay.on{opacity:1; pointer-events:auto}
#drawer{
  position:fixed; top:0; right:0; bottom:0; width:var(--drawer-w); max-width:100vw;
  background:var(--card); z-index:70; display:flex; flex-direction:column;
  box-shadow:-12px 0 40px rgba(0,0,0,.18);
  transform:translateX(105%); transition:transform .22s ease;
}
#drawer.on{transform:translateX(0)}
.d-head{
  display:flex; align-items:center; gap:8px;
  padding:calc(12px + var(--sa-t)) calc(14px + var(--sa-r)) 12px 14px;
  border-bottom:1px solid var(--line); background:#FAFAF8;
}
.d-nav{display:flex; gap:4px}
.icon-btn{
  appearance:none; border:1px solid var(--line2); background:var(--card); color:var(--ink2);
  border-radius:8px; width:40px; height:40px; cursor:pointer; font-size:16px;
  display:flex; align-items:center; justify-content:center;
}
.icon-btn:hover{border-color:var(--ink2)}
.icon-btn:disabled{opacity:.35; cursor:default}
.d-title{flex:1; min-width:0; text-align:center}
.d-title .q{font-family:'Barlow Condensed'; font-weight:700; font-size:21px; color:var(--ink)}
.d-title .q.u-exp{color:var(--red-dk)}
.d-title .q.u-soon{color:var(--amber)}
.d-title .q.u-closed{color:var(--muted)}
.d-title .n{font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.d-search{padding:10px calc(14px + var(--sa-r)) 10px 14px; border-bottom:1px solid var(--line); position:relative}
.d-search input{
  width:100%; padding:9px 30px 9px 34px; border:1px solid var(--line2); border-radius:8px;
  outline:none; font-size:13.5px; background:var(--paper);
}
.d-search input:focus{border-color:var(--ink2); background:#fff}
.d-search .mag{position:absolute; left:25px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none}
.d-search .clr{
  position:absolute; right:22px; top:50%; transform:translateY(-50%);
  appearance:none; border:none; background:none; color:var(--muted); cursor:pointer; font-size:15px;
  display:none; padding:6px;
}
.d-search.has .clr{display:block}
.d-body{flex:1; overflow-y:auto; padding:14px calc(14px + var(--sa-r)) 14px 14px; -webkit-overflow-scrolling:touch}
/* outcome banner — closed quotes announce their result at the top of the panel */
.d-outcome{
  display:flex; align-items:center; gap:10px; margin:0 0 16px; padding:12px 14px;
  border-radius:10px; font-weight:700; font-size:15px; border:1px solid transparent;
}
.d-outcome .oc-ic{font-size:17px; line-height:1; flex:none}
.d-outcome .oc-sub{font-weight:500; font-size:12px; opacity:.75; margin-left:auto; padding-left:10px; text-align:right}
.d-outcome.oc-won{background:var(--green-bg); color:var(--green); border-color:#CBE3D4}
.d-outcome.oc-post{background:var(--amber-bg); color:var(--amber); border-color:#EBD9B4}
.d-outcome.oc-red{background:var(--red-bg); color:var(--red-dk); border-color:#EFD2D1}
.d-outcome.oc-lost{background:#F1F0EC; color:var(--ink2); border-color:var(--line2)}
/* outcome colour picker (v0.32) — green / yellow / red, chosen by hand on any answer */
.sw-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
.sw-row.dim{opacity:.5}
.sw{
  appearance:none; font:inherit; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  font-size:12px; font-weight:650; color:var(--ink2); background:#F7F6F2;
  border:1px solid var(--line2); border-radius:999px; padding:5px 11px; min-height:30px;
}
.sw i{width:11px; height:11px; border-radius:50%; flex:none; border:1px solid rgba(0,0,0,.14)}
.sw-green i{background:var(--green)} .sw-yellow i{background:#E0A93E} .sw-red i{background:var(--red)}
.sw:hover{border-color:var(--ink2)}
.sw.on{color:#fff; border-color:transparent}
.sw-green.on{background:var(--green)} .sw-yellow.on{background:#B26A00} .sw-red.on{background:var(--red)}
.sw.on i{background:#fff; border-color:rgba(255,255,255,.65)}
.sw-hint{font-size:11.5px; color:var(--muted); margin-top:6px; line-height:1.4}
.d-results .rrow{
  display:flex; flex-direction:column; gap:1px; width:100%; text-align:left;
  appearance:none; background:none; border:none; border-bottom:1px solid var(--line);
  padding:10px 6px; cursor:pointer; font:inherit; color:inherit;
}
.d-results .rrow:hover{background:#FAFAF8}
.d-results .t{font-weight:600; font-size:13.5px}
.d-results .t b{color:var(--red-dk); font-family:'Barlow Condensed'; font-size:15px}
.d-results .s{font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.d-results .none{padding:18px 6px; color:var(--muted); font-size:13px; text-align:center}
.d-actions{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.act-btn{
  appearance:none; border:1px solid var(--line2); background:var(--card); color:var(--ink);
  border-radius:8px; padding:8px 13px; font-size:12.5px; font-weight:600; cursor:pointer;
  text-decoration:none; display:inline-flex; align-items:center; gap:6px; min-height:40px;
}
.act-btn:hover{border-color:var(--blue); color:var(--blue)}
.d-sec{margin-bottom:18px}
.ea-item{padding:8px 0;border-bottom:0.5px solid var(--line)}
.ea-item:last-child{border-bottom:none}
.ea-sum{font-size:13px;color:var(--ink2);margin-top:3px}
.ea-ev{font-size:12px;color:var(--muted);font-style:italic;margin-top:2px;overflow-wrap:anywhere}
.d-sec h3{
  font-family:'Barlow Condensed'; font-weight:600; font-size:15px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--muted); margin:0 0 8px;
  border-bottom:1px solid var(--line); padding-bottom:5px;
}
.info-grid{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:13.5px}
.info-grid .k{color:var(--muted); white-space:nowrap}
.info-grid .v{min-width:0; word-break:break-word}
.d-field{margin-bottom:13px}
.d-field label{
  display:block; font-family:'Barlow Condensed'; font-weight:600; font-size:14px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--red-dk); margin-bottom:5px;
}
.ctl input[type=text], .ctl select, .ctl textarea{
  width:100%; padding:10px; border:1px solid var(--line2); border-radius:8px; background:#fff; outline:none;
}
.ctl textarea{min-height:74px; resize:vertical; line-height:1.4}
.ctl input:focus, .ctl select:focus, .ctl textarea:focus{border-color:var(--blue); box-shadow:0 0 0 2px rgba(43,95,163,.14)}
.ctl.changed input, .ctl.changed select, .ctl.changed textarea{border-color:var(--amber); background:#FFFDF4}
.chips{display:flex; gap:5px; margin-top:6px; flex-wrap:wrap}
.chip{
  appearance:none; border:1px solid var(--line2); background:var(--card); color:var(--ink2);
  font-size:11.5px; font-weight:600; border-radius:99px; padding:6px 11px; cursor:pointer; min-height:32px;
}
.chip:hover{border-color:var(--blue); color:var(--blue)}
.backlist{appearance:none; border:none; background:none; color:var(--blue); font-size:12px; cursor:pointer; padding:4px 2px; margin-top:3px}
.log-item{border-bottom:1px dashed var(--line); padding:7px 0; font-size:12.5px}
.log-item:last-child{border-bottom:none}
.log-item .lt{color:var(--muted); font-size:11.5px; display:flex; gap:8px; flex-wrap:wrap}
.log-item .ld{color:var(--ink2); margin-top:2px; word-break:break-word}
.log-none{color:var(--muted); font-size:12.5px}
.d-foot{
  border-top:1px solid var(--line); background:#FAFAF8;
  padding:11px calc(14px + var(--sa-r)) calc(11px + var(--sa-b)) 14px;
  display:flex; align-items:center; gap:10px; justify-content:flex-end;
}
.revert{
  appearance:none; border:none; background:none; color:var(--muted); font-size:12.5px;
  cursor:pointer; text-decoration:underline; display:none; margin-right:auto;
}
.d-foot.dirty .revert{display:block}
.savebtn{
  appearance:none; border:1px solid var(--line2); background:var(--card); color:var(--muted);
  border-radius:9px; padding:11px 20px; font-size:14px; font-weight:700; cursor:default; min-height:46px;
}
.d-foot.dirty .savebtn{background:var(--blue); border-color:var(--blue); color:#fff; cursor:pointer}
.d-foot.dirty .savebtn:hover{background:var(--blue-dk)}
.savebtn.saving{opacity:.6; pointer-events:none}
.nextbtn{
  appearance:none; border:1px solid var(--ink); background:var(--ink); color:#fff;
  border-radius:9px; padding:11px 18px; font-size:14px; font-weight:700; cursor:pointer; min-height:46px;
}
.nextbtn:hover{background:#000}
.nextbtn:disabled{opacity:.4; cursor:default}

@media (max-width:880px){
  .summary{padding:10px calc(10px + var(--sa-r)) 0 calc(10px + var(--sa-l))}
}
@media (max-width:640px){
  :root{--drawer-w:100vw}
  .brand .sub{display:none}
  .hd-inner .email{max-width:128px; font-size:11px}
  main{padding:10px calc(10px + var(--sa-r)) calc(90px + var(--sa-b)) calc(10px + var(--sa-l))}
  .toolbar{padding:10px calc(10px + var(--sa-r)) 0 calc(10px + var(--sa-l))}
  .filters{padding:10px calc(10px + var(--sa-r)) 2px calc(10px + var(--sa-l))}
  .banner{padding:0 calc(10px + var(--sa-r)) 0 calc(10px + var(--sa-l))}
  /* tab bar: compact + scrolls within itself — never breaks page width */
  .tabs-inner{overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none}
  .tabs-inner::-webkit-scrollbar{display:none}
  .tab{font-size:16.5px; padding:11px 12px 9px; gap:6px; min-height:46px; flex:none; white-space:nowrap}
  .tab .cnt{font-size:10px; padding:1px 6px}
  /* compact attention bar: one scrollable line + All stats toggle */
  .attn{flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; gap:14px; padding:9px 12px}
  .attn .tag{font-size:13px; letter-spacing:.1em}
  .attn button.stat{font-size:12px; white-space:nowrap}
  .attn button.stat b{font-size:17px}

  .kpis{display:none; grid-template-columns:repeat(2, 1fr)}

  .kpi.zero{display:none}
  /* search full width, compact controls */

  select.sortsel{padding:7px 8px; font-size:12px; min-height:36px}
  .stale{font-size:10.5px; padding:5px 9px; min-height:28px}
  .fchip{padding:6px 11px; min-height:32px; font-size:12px}
  .fchip .n{font-size:10px}
  /* job cards */
  .row{padding:14px}
  .r-q{font-size:18px}
  .r-nm{font-size:15.5px}
  .r-ttl{
    white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;

}

/* ============ Larger type + padding on desktop ============ */

  .tab .cnt{font-size:12px}
  .attn .tag{font-size:16px}

  .kpi .sub{font-size:13px}
  select.sortsel{font-size:14px}
  .stale{font-size:12.5px}
  .fchip{font-size:13.5px}
  .fchip .n{font-size:11.5px}
  .row{padding:14px 16px}
  .r-q{font-size:18.5px}
  .r-nm{font-size:16px}
  .r-ttl{font-size:14px}
  .badge{font-size:12.5px}

  .d-search input{font-size:14.5px}
  .act-btn{font-size:13.5px}
  .d-sec h3{font-size:16px}
  .info-grid{font-size:15px}
  .d-field label{font-size:15.5px}
  .chip{font-size:12.5px}
  .log-item{font-size:13.5px}
  .log-item .lt{font-size:12.5px}
  .log-none{font-size:13.5px}
  .d-results .t{font-size:14.5px}
  .d-results .t b{font-size:16px}
  .d-results .s{font-size:13px}
  .savebtn, .nextbtn{font-size:15px}
  .revert{font-size:13.5px}
  /* padding scaled to match */
  .hd-inner{padding:calc(12px + var(--sa-t)) calc(24px + var(--sa-r)) 12px calc(24px + var(--sa-l))}
  .tabs-inner{padding:0 16px}
  .summary{padding:14px calc(24px + var(--sa-r)) 4px calc(24px + var(--sa-l))}
  .toolbar{padding:14px calc(24px + var(--sa-r)) 0 calc(24px + var(--sa-l))}
  .filters{padding:12px calc(24px + var(--sa-r)) 2px calc(24px + var(--sa-l))}
  .banner{padding:0 calc(24px + var(--sa-r)) 0 calc(24px + var(--sa-l))}
  main{padding:14px calc(24px + var(--sa-r)) calc(90px + var(--sa-b)) calc(24px + var(--sa-l))}
  .attn{padding:12px 18px}
  .kpi{padding:14px 18px 13px}
  .search input{padding:11px 12px 11px 38px}
  select.sortsel{padding:10px 12px}
  .fchip{padding:9px 16px}
  .fu{padding:4px 10px}
  .d-head{padding:calc(14px + var(--sa-t)) calc(16px + var(--sa-r)) 14px 16px}
  .d-search{padding:12px calc(16px + var(--sa-r)) 12px 16px}
  .d-body{padding:22px max(22px, calc((100% - 900px)/2)); padding-right:calc(max(22px, (100% - 900px)/2) + var(--sa-r))}
  .ctl input[type=text], .ctl select, .ctl textarea{padding:11px 12px}
  .act-btn{padding:9px 15px}
  .chip{padding:7px 13px}
  .d-foot{padding:13px calc(16px + var(--sa-r)) calc(13px + var(--sa-b)) 16px}
}

/* ============ Sign-in gate ============ */
.gate{min-height:calc(100vh - 60px); display:flex; align-items:center; justify-content:center; padding:20px}
.gate-card{
  background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow);
  max-width:400px; width:100%; padding:34px 30px; text-align:center;
}
.gate-card .glogo{font-family:'Barlow Condensed'; font-weight:700; font-size:30px; text-transform:uppercase; letter-spacing:.04em}
.gate-card .glogo b{color:var(--red)}
.gate-card p{color:var(--muted); font-size:13.5px; margin:10px 0 24px}
.gbtn{
  appearance:none; width:100%; padding:13px 16px; border-radius:10px; border:none;
  background:var(--ink); color:#fff; font-size:15px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:10px;
}
.gbtn:hover{background:#000}
.gbtn:disabled{opacity:.6; cursor:default}
.gate-err{color:var(--red-dk); font-size:12.5px; margin-top:14px; display:none}

/* ============ Compose & send modal ============ */
#mailWrap, #smsWrap, #threadWrap{
  position:fixed; inset:0; background:rgba(20,22,26,.5); z-index:95;
  display:none; align-items:center; justify-content:center;
  padding:calc(16px + var(--sa-t)) calc(16px + var(--sa-r)) calc(16px + var(--sa-b)) calc(16px + var(--sa-l));
}
#mailWrap.on, #smsWrap.on, #threadWrap.on{display:flex}
/* ---- SMS conversation thread ---- */
#threadWrap .mailer{width:560px}
.t-body{
  padding:14px 16px; overflow-y:auto; display:flex; flex-direction:column; gap:8px;
  min-height:220px; max-height:56vh; background:var(--paper);
}
.bub{
  max-width:80%; padding:8px 11px; border-radius:12px; font-size:13.5px; line-height:1.45;
  white-space:pre-wrap; word-break:break-word;
}
.bub.out{align-self:flex-end; background:var(--ink); color:#fff; border-bottom-right-radius:4px}
.bub.in{align-self:flex-start; background:#fff; border:1px solid var(--line); border-bottom-left-radius:4px}
.bub.out.failed{background:var(--red-bg); color:var(--red-dk); border:1px solid var(--red)}
.bub.out.pending{opacity:.75}
.bub.mail{
  align-self:center; max-width:92%; background:var(--blue-bg); border:1px solid var(--line);
  color:var(--ink2); font-size:12.5px; border-radius:8px;
}
.bub .bt{display:block; font-size:10.5px; opacity:.68; margin-top:3px}
.t-day{align-self:center; font-size:11px; color:var(--muted); margin:4px 0; letter-spacing:.04em}
.t-foot{display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--line); background:#FAFAF8; align-items:flex-end}
.t-foot textarea{
  flex:1; padding:9px 11px; border:1px solid var(--line2); border-radius:8px;
  resize:none; min-height:38px; max-height:110px; line-height:1.4; outline:none;
}
.t-foot textarea:focus{border-color:var(--blue); box-shadow:0 0 0 2px rgba(43,95,163,.14)}
.mailer{
  background:var(--card); width:600px; max-width:100%; max-height:100%;
  border-radius:14px; display:flex; flex-direction:column;
  box-shadow:0 20px 60px rgba(0,0,0,.3); overflow:hidden;
}
.m-head{
  display:flex; align-items:center; gap:8px; padding:12px 16px;
  border-bottom:1px solid var(--line); background:#FAFAF8;
  font-family:'Barlow Condensed'; font-weight:700; font-size:18px;
  letter-spacing:.06em; text-transform:uppercase;
}
.m-head .icon-btn{margin-left:auto}
.m-body{padding:14px 16px; overflow-y:auto; display:flex; flex-direction:column; gap:11px}
.m-f label{
  display:block; font-family:'Barlow Condensed'; font-weight:600; font-size:13.5px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:4px;
}
.m-f input, .m-f textarea{
  width:100%; padding:10px 11px; border:1px solid var(--line2); border-radius:8px;
  outline:none; font-size:14px;
}
.m-f textarea{min-height:220px; resize:vertical; line-height:1.5}
.m-f input:focus, .m-f textarea:focus{border-color:var(--blue); box-shadow:0 0 0 2px rgba(43,95,163,.14)}
.m-foot{
  display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line);
  background:#FAFAF8; align-items:center; flex-wrap:wrap;
}
.m-foot .ghost{
  appearance:none; border:1px solid var(--line2); background:var(--card); color:var(--ink2);
  border-radius:8px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; min-height:40px;
}
.m-foot .ghost:hover{border-color:var(--ink2)}
.m-send{
  appearance:none; margin-left:auto; border:1px solid var(--blue); background:var(--blue); color:#fff;
  border-radius:9px; padding:11px 20px; font-size:14px; font-weight:700; cursor:pointer; min-height:44px;
}
.m-send:hover{background:var(--blue-dk)}
.m-send:disabled{opacity:.45; cursor:default}
@media (max-width:640px){
  #mailWrap, #smsWrap, #threadWrap{padding:0}
  .mailer{width:100%; height:100%; max-height:none; border-radius:0}
  .m-f textarea{min-height:180px}
}

/* ============ Change history panel ============ */
#histWrap{position:fixed; inset:0; background:rgba(20,22,26,.45); z-index:90; display:none}
#histWrap.on{display:flex; justify-content:flex-end}
.hist{
  width:var(--drawer-w); max-width:100vw; background:var(--card); height:100%;
  display:flex; flex-direction:column; box-shadow:-12px 0 40px rgba(0,0,0,.18);
}
.h-head{display:flex; align-items:center; gap:10px; padding:calc(12px + var(--sa-t)) calc(16px + var(--sa-r)) 12px 16px; border-bottom:1px solid var(--line); background:#FAFAF8}
.h-title{font-family:'Barlow Condensed'; font-weight:700; font-size:19px; letter-spacing:.06em; text-transform:uppercase}
.h-sub{font-size:11.5px; color:var(--muted)}
.h-head .icon-btn{margin-left:auto}
.h-search{padding:10px calc(16px + var(--sa-r)) 10px 16px; border-bottom:1px solid var(--line)}
.h-search input{
  width:100%; padding:9px 11px; border:1px solid var(--line2); border-radius:8px;
  outline:none; background:var(--paper);
}
.h-search input:focus{border-color:var(--ink2); background:#fff}
.h-body{flex:1; overflow-y:auto; padding:6px calc(16px + var(--sa-r)) calc(20px + var(--sa-b)) 16px; -webkit-overflow-scrolling:touch}
.h-key{
  appearance:none; border:none; background:none; padding:0; cursor:pointer;
  font-family:'Barlow Condensed'; font-weight:700; color:var(--red-dk); font-size:14px;
}
.h-key:hover{text-decoration:underline}
.undo-btn{
  appearance:none; border:1px solid var(--line2); background:var(--card); color:var(--ink2);
  border-radius:7px; padding:4px 10px; font-size:11.5px; font-weight:700; cursor:pointer; margin-top:5px;
}
.undo-btn:hover:not(:disabled){border-color:var(--blue); color:var(--blue)}
.undo-btn:disabled{opacity:.4; cursor:default}

/* ============ Toast / loading ============ */
#toast{
  position:fixed; left:50%; bottom:calc(24px + var(--sa-b)); transform:translateX(-50%) translateY(80px);
  background:var(--ink); color:#fff; font-size:13.5px; font-weight:600;
  padding:12px 20px; border-radius:10px; box-shadow:0 8px 30px rgba(0,0,0,.25);
  transition:transform .25s ease; z-index:110; max-width:calc(100vw - 40px - var(--sa-l) - var(--sa-r)); text-align:center;
}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--red-dk)}
#toast.ok{background:var(--green)}
.loading-bar{position:fixed; top:var(--sa-t, 0px); left:var(--sa-l, 0px); right:var(--sa-r, 0px); height:3px; z-index:200; display:none}
.loading-bar.on{display:block}
.loading-bar i{display:block; height:100%; width:30%; background:var(--red); border-radius:3px; animation:slide 1s ease-in-out infinite}
@keyframes slide{0%{margin-left:-30%}100%{margin-left:100%}}

/* v0.43 — full-bleed fixed panels on phones. At ≤640px the drawer, history
   panel and compose/thread dialogs cover the whole screen, so their headers,
   close buttons, bodies and footer actions must clear the notch, rounded
   corners and home indicator on all four sides. This block sits after every
   base rule above; equal-specificity source order means nothing later can
   silently strip these insets — the same defence the page containers use. */
@media (max-width:640px){
  .d-head{padding:calc(12px + var(--sa-t)) calc(14px + var(--sa-r)) 12px calc(14px + var(--sa-l))}
  .d-search{padding:10px calc(14px + var(--sa-r)) 10px calc(14px + var(--sa-l))}
  .d-body{padding:14px calc(14px + var(--sa-r)) 14px calc(14px + var(--sa-l))}
  .d-foot{padding:11px calc(14px + var(--sa-r)) calc(11px + var(--sa-b)) calc(14px + var(--sa-l))}
  .h-head{padding:calc(12px + var(--sa-t)) calc(16px + var(--sa-r)) 12px calc(16px + var(--sa-l))}
  .h-search{padding:10px calc(16px + var(--sa-r)) 10px calc(16px + var(--sa-l))}
  .h-body{padding:6px calc(16px + var(--sa-r)) calc(20px + var(--sa-b)) calc(16px + var(--sa-l))}
  .m-head{padding:calc(12px + var(--sa-t)) calc(16px + var(--sa-r)) 12px calc(16px + var(--sa-l))}
  .m-body{padding:14px calc(16px + var(--sa-r)) 14px calc(16px + var(--sa-l))}
  .m-foot{padding:12px calc(16px + var(--sa-r)) calc(12px + var(--sa-b)) calc(16px + var(--sa-l))}
  .t-body{padding:14px calc(16px + var(--sa-r)) 14px calc(16px + var(--sa-l))}
  .t-foot{padding:10px calc(12px + var(--sa-r)) calc(10px + var(--sa-b)) calc(12px + var(--sa-l))}
}
</style>

<body>

<div class="loading-bar" id="loadbar" aria-hidden="true"><i></i></div>

<header>

      <span class="sub">Job Dashboard</span>

<!-- Sign-in gate -->
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="glogo"><b>ACE</b> Fire LA</div>
    <span class="ver"></span>
    <p>Team job dashboard. Sign in with your Google account (the one with access to the Wix quotes sheet).</p>
    <button class="gbtn" id="btnSignin">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      Sign in with Google
    </button>
    <div class="gate-err" id="gateErr" role="alert"></div>

<!-- App -->
<div id="app" style="display:none">
  <div class="summary" id="summary"></div>

    <div class="tabs-inner">
      <span id="tabbar" style="display:flex;gap:2px" role="tablist"></span>

const DAY = 86400000;
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getTime() + n * DAY);

function parseDate(v){
  const t = String(v || '').trim();
  if (!t) return null;
  /* build + round-trip verify so 2/30/2026 comes back null instead of silently becoming March 2 (v0.28) */
  const mk = (y, mo, da) => {
    const d = new Date(y, mo - 1, da);
    return (d.getFullYear() === y && d.getMonth() === mo - 1 && d.getDate() === da) ? d : null;
  };
  const m = t.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
  if (m){
    let y = m[3] ? +m[3] : new Date().getFullYear();
    if (y < 100) y += 2000;
    return mk(y, +m[1], +m[2]);
  }
  /* ISO dates are calendar dates — parse the components locally; new Date('2026-07-25') is UTC and lands a day early in LA */
  const iso = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (iso) return mk(+iso[1], +iso[2], +iso[3]);
  const d = new Date(t);
  return isNaN(d) ? null : startOfDay(d);
}
const fmtMD = d => (d.getMonth()+1) + '/' + d.getDate();

  });
}

/* =====================================================================
   Local cache — instant paint, then background refresh
   ===================================================================== */
function saveCache(){
  try {
    localStorage.setItem('acefire_cache_v1', JSON.stringify({
      ts: state.lastLoad, headers: state.headers, options: state.options,
      suggest: state.suggest, dupes: state.dupes,
      archive: state.archive.map(r => r.cells),
      qarchive: state.qarchive.map(r => r.cells),
      customers: state.customers,
      prefs: state.prefs, threadDone: state.threadDone, renStatus: state.renStatus, replyGroups: state.replyGroups, roles: state.roles, emailRefCounts: state.emailRefCounts,
      data: Object.fromEntries(TABS.map(t => [t.id, (state.data[t.id]||[]).map(r => r.cells)]))
    }));
  } catch(e){}
}
function hydrateCache(){
  try {
    const p = JSON.parse(localStorage.getItem('acefire_cache_v1') || 'null');
    if (!p || !p.data) return false;
    /* customer data shouldn't linger on shared computers — stale caches are discarded */
    if (!p.ts || Date.now() - p.ts > 4 * 3600 * 1000){ localStorage.removeItem('acefire_cache_v1'); return false; }
    TABS.forEach(t => {
      state.data[t.id] = (p.data[t.id] || []).map((cells, j) =>
        ({ uid: t.id + ':' + j, key: String(cells[0]||'').trim(), sheetRow: j + 2, cells, edits:{}, saving:false }));
    });
    state.headers = p.headers || {};
    state.options = p.options || {};
    state.suggest = p.suggest || {};
    state.dupes = p.dupes || {};
    state.archive = (p.archive || []).map(cells => ({ cells }));
    state.qarchive = (p.qarchive || []).map(cells => ({ cells }));
    state.customers = p.customers || {};
    state.prefs = p.prefs || {};
    state.threadDone = p.threadDone || {};
    state.emailRefCounts = p.emailRefCounts || {};
    state.renStatus = {};
    Object.entries(p.renStatus || {}).forEach(([k, v]) => {
      state.renStatus[k] = { status: v.status || '', dueAtMark: v.dueAtMark ? new Date(v.dueAtMark) : null,
        lastAtMark: v.lastAtMark ? new Date(v.lastAtMark) : null, row: v.row || 0 };
    });
    state.replyGroups = p.replyGroups || [];
    state.roles = p.roles || {};
    state.lastLoad = p.ts || 0;
    return true;
  } catch(e){ return false; }
}

/* =====================================================================
   Auth (Google Identity Services)
   ===================================================================== */
let tokenClient = null, pendingTokenResolve = null;

function gisReady(){
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.CLIENT_ID,
    scope: CONFIG.SCOPES,
    callback: resp => {
      if (resp.access_token){
        state.token = resp.access_token;
        if (pendingTokenResolve){ pendingTokenResolve(true); pendingTokenResolve = null; }
        else onSignedIn();
      }
    },
    error_callback: () => {
      if (pendingTokenResolve){ pendingTokenResolve(false); pendingTokenResolve = null; return; }
      const g = $('#gateErr');
      g.style.display = 'block';
      g.textContent = 'Sign-in was cancelled or blocked. Try again.';
      $('#btnSignin').disabled = false;
    }
  });
  const hint = localStorage.getItem('acefire_hint');
  if (hint) silentToken(hint).then(ok => { if (ok) onSignedIn(); });
}
function silentToken(hint){
  return new Promise(resolve => {
    pendingTokenResolve = resolve;
    try { tokenClient.requestAccessToken({ prompt:'', hint: hint || state.email || undefined }); }
    catch(e){ pendingTokenResolve = null; resolve(false); }
    setTimeout(() => { if (pendingTokenResolve){ pendingTokenResolve = null; resolve(false); } }, 8000);
  });
}
$('#btnSignin').addEventListener('click', () => {
  $('#btnSignin').disabled = true;
  $('#gateErr').style.display = 'none';
  tokenClient.requestAccessToken({ prompt:'' });
  setTimeout(() => $('#btnSignin').disabled = false, 4000);
});
$('#btnSignout').addEventListener('click', () => {
  const tk = state.token;
  state.token = null;
  localStorage.removeItem('acefire_hint');
  localStorage.removeItem('acefire_cache_v1');
  if (tk){ try { google.accounts.oauth2.revoke(tk, () => {}); } catch(e){} }
  location.reload();
});

/* =====================================================================
   Sheets API wrapper (401 → silent refresh → retry)
   ===================================================================== */
async function api(path, opts = {}, retry = true){
  const r = await fetch('https://sheets.googleapis.com/v4/spreadsheets/' + CONFIG.SPREADSHEET_ID + path, {
    ...opts,
    headers:{ 'Content-Type':'application/json', ...(opts.headers || {}), Authorization:'Bearer ' + state.token }
  });
  if (r.status === 401 && retry){
    const ok = await silentToken(state.email);
    if (ok) return api(path, opts, false);
    localStorage.removeItem('acefire_cache_v1');   // don't leave customer data behind on a signed-out browser
    toast('Session expired — sign in again', 'err');
    $('#gate').style.display = 'flex';
    $('#app').style.display = 'none';
    closeDrawer();
    throw new Error('auth');
  }
  if (!r.ok){
    let msg = 'API error ' + r.status;
    try { msg = (await r.json()).error?.message || msg; } catch(e){}
    throw new Error(msg);
  }
  return r.json();
}

/* =====================================================================
   Filters / sort / stages
   ===================================================================== */
const daysNum = r => { const n = parseInt(String(r.cells[8]).replace(/[^\-0-9]/g,''),10); return isNaN(n) ? null : n; };
const noFollowUp = r => [10,11,12].every(c => { const v = (r.cells[c]||'').trim().toLowerCase(); return v === '' || v === 'not sent'; });

const OUTCOME_OPTIONS = ['Won','Went with competitor','No longer needed','Too expensive','Postponed','No response','Bad contact info'];

/* ---- outcome colours (v0.32) ------------------------------------------
   The colour you pick is stored as a coloured dot in front of the answer —
   the Quotes sheet cell literally reads "🟡 Follow up on 8/5". That way the
   choice survives in Sheets, in Supabase and in any export, with no extra
   column, and the dashboard tints the list row + panel banner to match.
   Outcomes saved before v0.32 have no dot and keep the old keyword guess. */
const OUTCOME_COLORS = [
  { key:'green',  dot:'🟢', kind:'won',  label:'Green',  hint:'Good — won, handled, approved' },
  { key:'yellow', dot:'🟡', kind:'post', label:'Yellow', hint:'Follow up / waiting — e.g. “Follow up on 8/5”' },
  { key:'red',    dot:'🔴', kind:'red',  label:'Red',    hint:'Lost or a problem — needs attention' }
];
const OUTCOME_DOT_RE = /^\s*(\u{1F7E2}|\u{1F7E1}|\u{1F534})\s*/u;
const outcomeColor = o => {
  const m = OUTCOME_DOT_RE.exec(String(o || ''));
  return m ? ((OUTCOME_COLORS.find(c => c.dot === m[1]) || {}).key || '') : '';
};
/* the answer with its colour dot removed — what we show in badges and banners */
const outcomeText = o => String(o || '').replace(OUTCOME_DOT_RE, '').trim();
/* recombine answer + colour into the value we store in the sheet */
const withOutcomeColor = (text, key) => {
  const t = outcomeText(text);
  if (!t) return '';
  const c = OUTCOME_COLORS.find(x => x.key === key);
  return c ? c.dot + ' ' + t : t;
};

const outcomeOf = r => (r.cells[16] || '').trim();
const isClosed = r => !!outcomeOf(r);
/* one classification for list tint + drawer banner — an explicit colour dot wins;
   otherwise fall back to reading the words, which also catches custom typed
   outcomes like "Pending approval" (v0.29) */
const outcomeKind = o => {
  const picked = outcomeColor(o);
  if (picked) return (OUTCOME_COLORS.find(c => c.key === picked) || {}).kind || 'lost';
  const t = low(outcomeText(o));
  if (!t) return '';
  if (/\bwon\b/.test(t)) return 'won';
  if (/postpon|pause|pending|hold|later|follow.?up|revisit|call back|check back|next (year|month|cycle|quarter)/.test(t)) return 'post';
  return 'lost';
};
const outcomeClass = k => k === 'won' ? 'oc-won' : k === 'post' ? 'oc-post' : k === 'red' ? 'oc-red' : 'oc-lost';

/* ---- contact preferences (per customer, saved in the Contact Prefs tab) ----
   "No text (landline)" and "Do not contact" are enforced: they hide the
   texting buttons everywhere and the auto-reminder routine skips them. */
const PREF_OPTIONS = ['Prefers call','Prefers email','Prefers text','No text (landline)','Do not contact'];
const prefOf = name => (state.prefs[normName(name)] || {}).pref || '';
const prefNoText = name => /no text|do not contact/i.test(prefOf(name));
const prefNoContact = name => /do not contact/i.test(prefOf(name));
function prefBadge(name){
  const p = prefOf(name);
  if (!p) return '';
  if (/do not contact/i.test(p)) return '<span class="badge b-red" title="Contact preference">⛔ Do not contact</span>';
  if (/no text/i.test(p)) return '<span class="badge b-amber" title="Landline on file — texting disabled">☎ No text</span>';
  const icon = /call/i.test(p) ? '📞' : /email/i.test(p) ? '✉' : '💬';
  return `<span class="badge b-gray" title="Contact preference">${icon} ${esc(p)}</span>`;
}
const autoSenderName = () => {
  const n = state.email.split('@')[0] || '';
  return n ? n.charAt(0).toUpperCase() + n.slice(1) : '';
};
async function savePref(name, pref, viaKey){
  const k = normName(name);
  if (!k) return;
  const when = new Date().toLocaleString();
  const who = autoSenderName();
  const hit = state.prefs[k];
  if (hit && hit.row){
    await api('/values:batchUpdate', {
      method:'POST',
      body: JSON.stringify({ valueInputOption:'USER_ENTERED',
        data:[{ range:`'${CONFIG.PREFS_SHEET}'!A${hit.row}:D${hit.row}`, values:[[name, pref, who, when]] }] })
    });

  } else {
    const res = await api(`/values/${encodeURIComponent(`'${CONFIG.PREFS_SHEET}'!A:D`)}:append?valueInputOption=USER_ENTERED`, {
      method:'POST', body: JSON.stringify({ values:[[name, pref, who, when]] })
    });
    const m = String(res.updates ? res.updates.updatedRange : '').match(/![A-Z]+(\d+):/);

  }

  if (CONFIG.ACTIVITY_LOG_SHEET){
    const entry = [when, state.email, 'Contact preference', CONFIG.PREFS_SHEET, viaKey || '',
      name + ' → ' + (pref || '(cleared)'), ''];

    logActivityAppend(entry);
  }
}

function filterDefs(tab){
  if (tab.id === 'quotes'){
    return [
      { id:'all',      label:'All',              fn:() => true },
      { id:'active',   label:'Active',           fn:r => { if (isClosed(r)) return false; const d = daysNum(r); return d === null || d >= 0; } },
      { id:'exp7',     label:'Expiring ≤7d',     fn:r => { if (isClosed(r)) return false; const d = daysNum(r); return d !== null && d >= 0 && d <= 7; } },
      { id:'expired',  label:'Expired',          fn:r => { if (isClosed(r)) return false; const d = daysNum(r); return d !== null && d < 0; } },
      { id:'nofu',     label:'No follow-up',     fn:r => !isClosed(r) && noFollowUp(r) },
      { id:'closed',   label:'Closed',           fn:isClosed }
    ];
  }
  return [
    { id:'all',        label:'All',              fn:() => true },
    { id:'needs',      label:'Needs action',     fn:r =>
        !(r.cells[7]||'').trim() || !(r.cells[9]||'').trim() ||
        low(r.cells[6]) === 'overdue' ||
        (low(r.cells[3]) === 'completed' && ['','not sent'].includes(low(r.cells[6]))) },
    { id:'notsched',   label:'To schedule',      fn:r => !(r.cells[7]||'').trim() },
    { id:'noreport',   label:'Reports not sent', fn:r => !(r.cells[9]||'').trim() },
    { id:'compninv',   label:'Ready to invoice', fn:r => low(r.cells[3]) === 'completed' && ['','not sent'].includes(low(r.cells[6])) },
    { id:'awaitpay',   label:'Awaiting payment', fn:r => low(r.cells[6]) === 'sent' },
    { id:'overdueinv', label:'Overdue invoices', fn:r => low(r.cells[6]) === 'overdue' },
    { id:'retest',     label:'Retest / repair',  fn:r => ['pending','awaiting approval','scheduled'].includes(low(r.cells[11])) },
    { id:'paid',       label:'Paid',             fn:r => low(r.cells[6]) === 'paid' },
    { id:'nojob',      label:'Unassigned',       fn:r => !(r.cells[13]||'').trim() }
  ];
}
function sortDefs(tab){
  const base = [{ id:'sheet', label:'Default order' }, { id:'newest', label:'Newest quote #' }];
  if (tab.id === 'quotes') base.splice(1, 0, { id:'expiring', label:'Expiring first' });
  return base;
}
function visibleRows(tab){
  let rows = state.data[tab.id] || [];
  const fdef = filterDefs(tab).find(f => f.id === state.filter[tab.id]) || filterDefs(tab)[0];
  rows = rows.filter(fdef.fn);
  if (tab.id === 'tracker' && state.trackerStatus){
    rows = rows.filter(r => (r.cells[3]||'').trim() === state.trackerStatus);
  }
  if (tab.id === 'quotes' && state.filter.quotes === 'closed' && state.quotesOutcome){
    rows = rows.filter(r => outcomeOf(r) === state.quotesOutcome);
  }
  const q = srchQ(state.search);
  if (q) rows = rows.filter(r => srchHit(searchText(tab, r), q));
  const s = state.sort[tab.id];
  if (s === 'newest') rows = [...rows].sort((a,b) => quoteNum(b.key) - quoteNum(a.key));
  else if (s === 'expiring') rows = [...rows].sort((a,b) => (daysNum(a) ?? 9e9) - (daysNum(b) ?? 9e9));
  return rows;
}

/* --- search normalisation (v0.31) -----------------------------------
   Sheets hands us FORMATTED_VALUE, so money arrives as "$1,000.00" and
   phones as "+1 818-339-8016". Typing 1000 or 8183398016 used to miss.
   srchTxt() expands the haystack; srchQ() canonicalises the query.     */
function srchTxt(s){
  const t = String(s == null ? '' : s).toLowerCase();
  // "$1,000.00" -> "1000.00"  (only strips commas sitting in a digit group)
  const flat = t.replace(/\$/g, '').replace(/(\d),(?=\d{3}(?!\d))/g, '$1');
  // digits-only copies of phone-like runs, appended so both forms match
  const phones = (t.match(/\d[\d\s().+-]{6,}\d/g) || [])
    .map(x => x.replace(/\D/g, ''))
    .filter(x => x.length >= 7);
  return phones.length ? flat + ' ' + phones.join(' ') : flat;
}
function srchQ(q){
  const t = String(q == null ? '' : q).toLowerCase().trim();
  const d = t.replace(/\D/g, '');
  // an all-punctuation-and-digits query with 7+ digits is a phone: compare bare
  if (d.length >= 7 && /^[\d\s().+-]+$/.test(t)) return d;
  return t.replace(/\$/g, '').replace(/(\d),(?=\d{3}(?!\d))/g, '$1');
}
function srchHit(text, q){ return srchTxt(text).includes(q); }

function searchText(tab, r){
  const skip = (tab.id === 'quotes' && !(CONFIG.SHOW_FINANCIALS || isAdmin())) ? [7] : [];
  return r.cells.filter((_, i) => !skip.includes(i)).join(' ').toLowerCase();
}

function buildTabBar(){

  visibleTabs().forEach(t => {
    const b = document.createElement('button');
    b.className = 'tab' + (state.activeTab === t.id ? ' active' : '');
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', state.activeTab === t.id ? 'true' : 'false');
    b.innerHTML = `${t.label} <span class="cnt" data-cnt="${t.id}">–</span>`;
    b.addEventListener('click', () => {
      state.activeTab = t.id;
      $$('.tab').forEach(x => { x.classList.remove('active'); x.setAttribute('aria-selected','false'); });
      b.classList.add('active');
      b.setAttribute('aria-selected','true');
      renderAll();
    });
    bar.appendChild(b);
  });
}

/* AI "Today's Priorities" bar — replaces the attention-stat strip.
   Written each morning (and on manual refresh) by the standalone Priorities
   Service (Priorities.gs); the dashboard just reads the Priorities tab.
   KPI cards stay available behind the All-stats toggle. */
const KPI_TILES = [
  { tab:'quotes',  filter:'exp7',       label:'Expiring soon',    sub:'Quotes expiring ≤7 days',  tone:'amber' },
  { tab:'quotes',  filter:'nofu',       label:'No follow-up',     sub:'Quotes missing follow-up', tone:'amber' },
  { tab:'tracker', filter:'overdueinv', label:'Overdue invoices', sub:'Need payment follow-up',   tone:'red' },
  { tab:'tracker', filter:'noreport',   label:'Reports not sent', sub:'Jobs missing reports',     tone:'amber' },
  { tab:'tracker', filter:'notsched',   label:'Needs scheduling', sub:'Missing Ember date',       tone:'amber' },
  { tab:'tracker', filter:'compninv',   label:'Ready to invoice', sub:'Work done, not invoiced',  tone:'blue' }
];
function countFor(tabId, filterId){
  const tab = TABS.find(t => t.id === tabId);
  const def = filterDefs(tab).find(f => f.id === filterId);
  return def ? (state.data[tabId] || []).filter(def.fn).length : 0;
}
function jumpTo(tabId, filterId){
  state.activeTab = tabId;
  state.filter[tabId] = filterId;
  if (tabId === 'tracker') state.trackerStatus = '';
  $$('.tab').forEach((x, i) => {
    const on = (visibleTabs()[i] || {}).id === tabId;
    x.classList.toggle('active', on);
    x.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  renderAll();
}
const PRIO_LEVEL = s => s >= 80 ? 'p1' : s >= 60 ? 'p2' : 'p3';
function fmtPrioAge(iso){
  const t = Date.parse(iso);
  if (!t) return '';
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 2) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60);
  if (h < 24) return h + 'h ago';
  const d = new Date(t);
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' +
    d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
}
async function loadPriorities(){
  try {
    const pr = await api(`/values/${encodeURIComponent(`'${CONFIG.PRIORITIES_SHEET}'!A2:L12`)}`);
    const rows = pr.values || [];
    state.prios.items = rows.filter(r => String(r[4] || '').trim()).map(r => ({
      type:String(r[1] || ''), tab:String(r[2] || ''), key:String(r[3] || '').trim(),
      title:String(r[4] || ''), score:parseInt(r[5], 10) || 0,
      level:String(r[6] || '').trim().toLowerCase(),
      reason:String(r[7] || ''), action:String(r[8] || ''), chip:String(r[11] || '').trim()
    }));
    state.prios.generated = String(((rows[0] || [])[9]) || '');
    state.prios.source = String(((rows[0] || [])[10]) || '');
  } catch(e){ state.prios.items = []; state.prios.generated = ''; state.prios.source = ''; }
}
const PRIO_DONE_LS = 'acefire_prio_done_v1';
function prioDoneSet(){
  try {
    const o = JSON.parse(localStorage.getItem(PRIO_DONE_LS) || 'null');
    if (o && o.gen === state.prios.generated && Array.isArray(o.keys)) return new Set(o.keys);
  } catch(e){}
  return new Set();
}
function prioMarkDone(p){
  const done = prioDoneSet();
  done.add(p.tab + '|' + p.key);
  try { localStorage.setItem(PRIO_DONE_LS, JSON.stringify({ gen: state.prios.generated, keys: [...done] })); } catch(e){}
  renderSummary();
}
function prioClearDone(){
  try { localStorage.removeItem(PRIO_DONE_LS); } catch(e){}
  renderSummary();
}
function prioJump(p){
  if (p.tab === 'texts'){ state.textsFilter = 'open'; jumpTo('texts', 'all'); return; }
  if (p.tab === 'renewals'){ jumpTo('renewals', 'all'); return; }
  const tab = TABS.find(t => t.id === p.tab);
  if (!tab){ toast('This priority has no linked record', 'err'); return; }
  const hit = rowByKey(tab.id, p.key);
  jumpTo(tab.id, 'all');
  if (hit) openDrawer(hit.uid);
  else toast('#' + p.key + ' isn\u2019t in the live sheet anymore \u2014 it may have been archived. Refresh priorities for a fresh list.', 'err');
}
async function refreshPriorities(){
  const url = String(CONFIG.PRIORITIES_URL || '').trim();
  if (!url){ toast('Deploy Priorities.gs, then paste its /exec URL into CONFIG.PRIORITIES_URL', 'err'); return; }
  if (state.prios.loading) return;
  state.prios.loading = true;
  renderSummary();
  try {
    const r = await fetch(url, { method:'POST', body: JSON.stringify({ action:'refresh', token: state.token }) });
    const txt = await r.text();
    let j = null;
    try { j = JSON.parse(txt); }
    catch(e){ throw new Error('The Priorities service returned a page instead of data \u2014 check the web app is deployed with access set to "Anyone"'); }
    if (!j || !j.success) throw new Error((j && j.error) || 'Priorities service call failed');
    await loadPriorities();
    toast(state.prios.source === 'fallback'
      ? 'Refreshed \u2014 AI was unreachable, showing the rule-based ranking'
      : 'Priorities refreshed', 'ok');
  } catch(e){ if (e.message !== 'auth') toast(String(e.message || e), 'err'); }
  state.prios.loading = false;
  renderSummary();
}

  const tog = document.createElement('button');

  tog.addEventListener('click', () => { state.statsOpen = !state.statsOpen; renderSummary(); });
  bar.appendChild(tog);
  box.appendChild(bar);

  const list = document.createElement('div');
  list.className = 'prios';
  if (!shown.length){
    const empty = document.createElement('div');

  }
  const xc = document.querySelector('[data-cnt="texts"]');
  if (xc) xc.textContent = computeThreads().reduce((s, t) => s + t.unread, 0);
  const pc = document.querySelector('[data-cnt="properties"]');
  if (pc) pc.textContent = (window.propAlertCount ? window.propAlertCount() : '');
  updateStale();
  renderSummary();

  /* ---- Renewals radar (computed, not a sheet) ---- */
  if (state.activeTab === 'renewals'){
    $('#sortSel').style.display = 'none';
    $('#statusSel').style.display = 'none';
    $('#dupeBanner').classList.remove('on');

    fb.innerHTML = '';
    const R = computeRenewals();
    const buckets = [
      { id:'overdue',   label:'Overdue',   fn:x => x.days < 0 && !x.dismissed },
      { id:'d30',       label:'Due ≤30d',  fn:x => x.days >= 0 && x.days <= 30 && !x.dismissed },
      { id:'d90',       label:'31–90d',    fn:x => x.days > 30 && x.days <= 90 && !x.dismissed },
      { id:'later',     label:'Later',     fn:x => x.days > 90 && !x.dismissed },
      { id:'dismissed', label:'Dismissed', fn:x => x.dismissed },
      { id:'all',       label:'All',       fn:() => true }
    ];
    buckets.forEach(bk => {
      const n = R.filter(bk.fn).length;
      const b = document.createElement('button');
      b.className = 'fchip' + (state.renBucket === bk.id ? ' active' : '');
      b.setAttribute('aria-pressed', state.renBucket === bk.id ? 'true' : 'false');

  /* ---- Texts (computed from SMS Outbox + SMS Inbox) ---- */

    $('#sortSel').style.display = 'none';
    $('#statusSel').style.display = 'none';
    $('#dupeBanner').classList.remove('on');
    const fb = $('#filterBar');
    fb.innerHTML = '';
    const T = computeThreads();
    const chips = [
      { id:'open',   label:'Open',   n:T.filter(t => !t.done).length },
      { id:'unread', label:'Unread', n:T.filter(t => t.unread > 0).length },
      { id:'done',   label:'Done',   n:T.filter(t => t.done).length },
      { id:'all',    label:'All',    n:T.length }
    ];
    chips.forEach(f => {
      const b = document.createElement('button');
      b.className = 'fchip' + ((state.textsFilter || 'open') === f.id ? ' active' : '');
      b.setAttribute('aria-pressed', (state.textsFilter || 'open') === f.id ? 'true' : 'false');
      b.innerHTML = `${esc(f.label)}<span class="n">${f.n}</span>`;
      b.addEventListener('click', () => { state.textsFilter = f.id; renderAll(); });
      fb.appendChild(b);
    });
    renderContent();
    return;
  }

  /* ---- Properties (frozen layer, read-only — v0.33) ---- */
  if (state.activeTab === 'properties'){
    $('#sortSel').style.display = 'none';
    $('#statusSel').style.display = 'none';
    $('#dupeBanner').classList.remove('on');
    const fb = $('#filterBar');
    fb.innerHTML = '';
    if (window.renderPropertiesToolbar) window.renderPropertiesToolbar(fb);
    renderContent();
    return;

  const tab = activeTabDef();

  sel.value = state.sort[tab.id];
  sel.style.display = '';

  const ss = $('#statusSel');
  if (tab.id === 'tracker'){
    const opts = state.options[3] || [];
    const present = [...new Set((state.data.tracker||[]).map(r => (r.cells[3]||'').trim()).filter(Boolean))];
    const all = [...new Set([...opts, ...present])];
    ss.innerHTML = '<option value="">Status: all</option>' + all.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('');
    ss.value = all.includes(state.trackerStatus) ? state.trackerStatus : '';
    ss.style.display = '';
  } else if (tab.id === 'quotes' && state.filter.quotes === 'closed'){
    const present = [...new Set((state.data.quotes||[]).map(outcomeOf).filter(Boolean))];
    ss.innerHTML = '<option value="">Reason: all</option>' + present.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('');
    if (!present.includes(state.quotesOutcome)) state.quotesOutcome = '';
    ss.value = state.quotesOutcome || '';
    ss.style.display = '';
  } else {
    if (tab.id === 'quotes') state.quotesOutcome = '';
    ss.style.display = 'none';
  }

  const fb = $('#filterBar');
  fb.innerHTML = '';
  const all = state.data[tab.id] || [];
  filterDefs(tab).forEach(f => {
    const n = all.filter(f.fn).length;
    if (f.id !== 'all' && n === 0) return;
    const b = document.createElement('button');
    b.className = 'fchip' + (state.filter[tab.id] === f.id ? ' active' : '');
    b.setAttribute('aria-pressed', state.filter[tab.id] === f.id ? 'true' : 'false');
    b.innerHTML = `${esc(f.label)}<span class="n">${n}</span>`;
    b.addEventListener('click', () => { state.filter[tab.id] = f.id; renderAll(); });
    fb.appendChild(b);
  });

  const dupes = state.dupes[tab.id] || [];
  $('#dupeBanner').classList.toggle('on', dupes.length > 0);
  if (dupes.length){
    $('#dupeText').textContent = `⚠ Duplicate quote #s on ${tab.label}: ${dupes.join(', ')} — saves on these #s are blocked until the duplicates are cleaned up in the sheet.`;
  }

  renderContent();
}
function renderContent(){

     Properties tab must also close any open property detail so its Back
     entry doesn't go stale. No-op when nothing is selected. */

function updateStale(){
  const el = $('#metaNote');
  if (!state.lastLoad){ el.textContent = '…'; return; }
  const mins = Math.floor((Date.now() - state.lastLoad) / 60000);
  el.className = 'stale' + (mins >= 15 ? ' old' : mins >= 5 ? ' warn' : '');
  el.textContent = mins < 1 ? 'Updated just now'
    : mins < 5 ? `Updated ${mins}m ago`
    : mins < 15 ? `Updated ${mins}m ago — tap to refresh`
    : `⚠ ${mins}m old — refresh`;
}

      Date.now() - state.lastLoad > CONFIG.STALE_MS){
