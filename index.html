/* v0.57 — 2-3 word job brief for Tracker rows: system (via the same
   classifier the property chips use) + work kind, from the title. */
/*BRIEF_START*/
function jobBrief(title){
  var t = String(title || '');
  if (!t) return '';
  var KINDS = [
    ['5-yr test',   /5[\s-]*(year|yr)/i],
    ['annual',      /annual/i],
    ['quarterly',   /quarterly/i],
    ['monthly',     /monthly/i],
    ['repair',      /repair/i],
    ['install',     /install/i],
    ['replace',     /replac/i],
    ['retest',      /re[\s-]?test/i],
    ['cert',        /certif/i],
    ['inspection',  /inspect/i],
    ['test',        /\btest/i],
    ['service call',/service\s*call/i]
  ];
  var kind = '';
  for (var i = 0; i < KINDS.length; i++){ if (KINDS[i][1].test(t)){ kind = KINDS[i][0]; break; } }
  var sys = (typeof window !== 'undefined' && typeof window.__systemsFromText === 'function') ? window.__systemsFromText(t) : [];
  var sysLabel = sys.length > 1 ? 'Multi-system' : (sys[0] || '');
  if (sysLabel && kind) return sysLabel + ' ' + kind;
  if (sysLabel) return sysLabel;
  return kind ? kind.charAt(0).toUpperCase() + kind.slice(1) : '';
}
/*BRIEF_END*/
window.__jobBrief = jobBrief;

      ch.addEventListener('keydown', e => e.stopPropagation());

    b.querySelectorAll('[data-act="qtext"]').forEach(ch => {
      ch.addEventListener('click', e => { e.stopPropagation(); draftQuoteText(r); });
      ch.addEventListener('keydown', e => e.stopPropagation());
    });
    b.querySelectorAll('[data-qc]').forEach(ch => {
      ch.addEventListener('click', e => {
        e.stopPropagation();
        quickContact(tab, r, +ch.dataset.qc, ch);
      });
      ch.addEventListener('keydown', e => e.stopPropagation());
    });
    list.appendChild(b);
  });
  main.appendChild(list);
}

/* primary badge shown right-aligned on the card's first line */
function rowSide(tab, r){
  if (tab.id === 'quotes'){
    const o = outcomeOf(r);
    if (o){
      const k = outcomeKind(o);
      const cls = k === 'won' ? 'b-green' : k === 'post' ? 'b-amber' : k === 'red' ? 'b-red' : 'b-gray';
      return `<span class="badge ${cls}" title="Outcome">${esc(outcomeText(o))}</span>`;
    }

  }

}
function rowMeta(tab, r){
  if (tab.id === 'quotes'){
    const parts = [];
    if (isAdmin() && (r.cells[7]||'').trim()) parts.push(`<span class="badge b-gray" title="Quote total">${esc(r.cells[7])}</span>`);
    if (r.cells[9]) parts.push(`<span class="badge b-gray">${esc(r.cells[9])}</span>`);
    const pb = prefBadge(r.cells[1]);
    if (pb) parts.push(pb);
    parts.push(eaListBadge('quotes', r.key));
    parts.push(fuTag(r, 10, '✉'), fuTag(r, 11, '💬'), fuTag(r, 12, '📞'));
    if (canContact() && !prefNoContact(r.cells[1])) parts.push('<button type="button" class="fu draft" data-act="qdraft" title="Draft & send a follow-up email">✉ Draft</button>');
    if (canContact() && (r.cells[3]||'').trim() && !prefNoText(r.cells[1])) parts.push('<button type="button" class="fu draft" data-act="qtext" title="Draft & send a follow-up text">💬 Text</button>');
    if (r.cells[15]) parts.push(`<span class="badge b-blue">${esc(r.cells[15])}${r.cells[14] ? ' · ' + esc(r.cells[14]) : ''}</span>`);
    return parts.filter(Boolean).join('');
  }
  const parts = [ statusBadge(r.cells[3]), wixBadge(r.cells[4]) ];
  const pb2 = prefBadge(r.cells[1]);
  if (pb2) parts.push(pb2);
  parts.push(eaListBadge('tracker', r.key));
  if (r.cells[13]) parts.push(jobBadge(r.cells[13]));
  if (r.cells[8]) parts.push(`<span class="badge b-blue">${esc(r.cells[8])}${r.cells[7] ? ' · ' + esc(r.cells[7]) : ''}</span>`);
  return parts.filter(Boolean).join('');
}
/* consistent status colors: red=overdue, amber=in progress/awaiting, blue=new/sent, green=done, gray=neutral */
function jobBadge(v){
  if (!v) return '';
  const t = low(v);
  let cls = 'b-gray';
  if (t === 'completed') cls = 'b-green';
  else if (t === 'new') cls = 'b-blue';
  else if (t === 'in progress' || t.startsWith('awaiting')) cls = 'b-amber';
  return `<span class="badge ${cls}">${esc(v)}</span>`;
}
function fuTag(r, col, icon){
  const verb = QC_LABEL[col];
  const t = (r.cells[col] || '').trim();
  if (!canContact()){
    if (!t || /^not sent$/i.test(t) || isX(t)) return '';
    const short = t.length > 10 ? t.slice(0,10) + '…' : t;
    return `<span class="badge b-gray" title="${verb} ${esc(t)}">${icon} ${verb} ${esc(short)}</span>`;
  }
  if (!t || /^not sent$/i.test(t)){
    return `<button type="button" class="fu off" data-qc="${col}" title="Not ${verb.toLowerCase()} yet — tap to mark ${verb.toLowerCase()} today" aria-label="Mark ${verb.toLowerCase()} today">${icon} ${QC_ACTION[col]}</button>`;
  }
  const short = t.length > 10 ? t.slice(0,10) + '…' : t;
  return `<button type="button" class="fu" data-qc="${col}" title="${verb} ${esc(t)} — tap to set today" aria-label="${verb} ${esc(t)}">${icon} ${verb} ${esc(short)}</button>`;
}
async function quickContact(tab, r, col, chipEl){
  if (r.saving) return;
  const cur = (r.cells[col] || '').trim();
  const verb = QC_LABEL[col];
  if (isX(cur)) { openDrawer(r.uid); return; }
  if (filledVal(cur) && !confirm(`${verb} already set to "${cur}" — replace with today (${todayMD()})?`)) return;
  r.saving = true;
  if (chipEl) chipEl.classList.add('busy');
  try {
    await commitEdits(tab, r, { [col]: todayMD() });
    toast(`#${r.key} — ${verb.toLowerCase()} ${todayMD()}`, 'ok');
  } catch(e){
    if (e.message !== 'auth') toast(e.message, 'err');
  } finally {
    r.saving = false;
    renderContent();
    renderSummary();
    if (state.drawerUid === r.uid && $('#drawer').classList.contains('on')) renderDrawer();
  }
}

function daysBadge(r){
  const n = daysNum(r);
  if (n === null) return r.cells[8] ? `<span class="badge b-gray">${esc(r.cells[8])}</span>` : '';
  if (n < 0)  return `<span class="badge b-red">Expired ${Math.abs(n)}d</span>`;
  if (n <= 7) return `<span class="badge b-amber">${n}d left</span>`;
  return `<span class="badge b-green">${n}d left</span>`;
}
function statusBadge(v){
  if (!v) return '';
  const m = { 'Completed':'b-green','Confirmed':'b-blue','Scheduled':'b-blue','In Progress':'b-amber','Unconfirmed':'b-gray','Cancelled':'b-red' };
  return `<span class="badge ${m[v]||'b-gray'}">${esc(v)}</span>`;
}
function wixBadge(v){
  if (!v) return '';
  const m = { 'Paid':'b-green','Invoiced':'b-amber','Accepted':'b-blue' };

function invStatusBadge(v){

}

/* ---- v0.57: back-button navigation ----------------------------------------
   Without history management the hardware/browser back button always LEFT the
   page, and since the Sheets token is memory-only that meant the sign-in gate
   on return — experienced as being logged out. Every overlay and the property
   detail now push one history entry on open; back closes the topmost surface.
   A surface closed by its own UI consumes its entry (history stays aligned).
   With nothing open, back exits normally. */
const BackNav = window.BackNav = {
  stack: [],
  ignore: 0,
  fromPop: false,
  replacing: false,
  pendingReplace: false,
  open(tag, closeFn){
    this.stack.push({ tag, closeFn });
    if (this.pendingReplace){
      /* v0.59 — a beginReplace() is in flight: reuse the outgoing surface's
         history entry at the same depth. replaceState is synchronous, so no
         traversal is queued and nothing can race. */
      this.pendingReplace = false;
      try { history.replaceState({ ace: this.stack.length }, ''); } catch(e){}
    } else {
      try { history.pushState({ ace: this.stack.length }, ''); } catch(e){}
    }
  },
  closed(tag){                       // surface closed via its own X / overlay tap
    if (this.fromPop) return;
    const i = this.stack.map(s => s.tag).lastIndexOf(tag);
    if (i === -1) return;
    this.stack.splice(i, 1);
    if (this.replacing) return;        // v0.59 — a transition owns this entry; no traversal is queued
    this.ignore++;
    try { history.back(); } catch(e){ this.ignore--; }
  },
  /* v0.59 — race-free surface swap. history.back() is a QUEUED async
     traversal, so close-then-push races (the queued back can pop the new
     entry, desyncing stack from history). beginReplace closes the old
     surface without queuing anything and arms the next open() to reuse the
     entry via replaceState. Call only when an open() follows synchronously. */
  beginReplace(closeOldFn){
    this.replacing = true;
    try { if (closeOldFn) closeOldFn(); } catch(e){}
    this.replacing = false;
    this.pendingReplace = true;
  }
};
window.addEventListener('popstate', () => {
  if (BackNav.ignore > 0){ BackNav.ignore--; return; }
  const top = BackNav.stack.pop();
  if (top){
    BackNav.fromPop = true;
    try { top.closeFn(); } catch(e){}
    BackNav.fromPop = false;
  }
});

function openDrawer(uid){
  state.drawerUid = uid;
  const t = tabOfUid(uid);
  state.drawerList = (t && t.id === state.activeTab) ? visibleRows(t).map(r => r.uid) : [uid];
  if (!state.drawerList.includes(uid)) state.drawerList = [uid];
  $('#dSearch').value = '';
  $('#dSearchWrap').classList.remove('has');
  renderDrawer();
  if (!$('#drawer').classList.contains('on')) BackNav.open('drawer', closeDrawer);
  $('#drawer').classList.add('on');
  $('#overlay').classList.add('on');
  document.body.classList.add('drawer-open');
  $('#drawer').setAttribute('aria-hidden', 'false');
  renderContent();
}
function closeDrawer(){
  BackNav.closed('drawer');
  $('#drawer').classList.remove('on');
  $('#overlay').classList.remove('on');
  document.body.classList.remove('drawer-open');
  $('#drawer').setAttribute('aria-hidden', 'true');
  renderContent();
}
$('#dClose').addEventListener('click', closeDrawer);
$('#overlay').addEventListener('click', closeDrawer);
$('#dPrev').addEventListener('click', () => stepDrawer(-1));
$('#dNext').addEventListener('click', () => stepDrawer(1));
document.addEventListener('keydown', e => {
  if (!$('#drawer').classList.contains('on')) return;
  const typing = /input|textarea|select/i.test(document.activeElement?.tagName || '');
  if (e.key === 'Escape'){ typing ? document.activeElement.blur() : closeDrawer(); }
  if (typing) return;
  if (e.key === 'ArrowLeft') stepDrawer(-1);
  if (e.key === 'ArrowRight') stepDrawer(1);
});
function stepDrawer(dir){
  const i = state.drawerList.indexOf(state.drawerUid);
  if (i < 0) return;
  const j = i + dir;
  if (j < 0 || j >= state.drawerList.length) return;
  state.drawerUid = state.drawerList[j];
  $('#dSearch').value = '';
  $('#dSearchWrap').classList.remove('has');
  renderDrawer();
  renderContent();
}

$('#dSearch').addEventListener('input', () => {
  const q = $('#dSearch').value;
  $('#dSearchWrap').classList.toggle('has', !!q);
  q.trim() ? renderDrawerResults(q.trim().toLowerCase()) : renderDrawer();
});
$('#dSearchClr').addEventListener('click', () => {
  $('#dSearch').value = '';
  $('#dSearchWrap').classList.remove('has');
  renderDrawer();
});
function renderDrawerResults(q){
  const tab = tabOfUid(state.drawerUid) || activeTabDef() || TABS[0];
  const hits = (state.data[tab.id] || []).filter(r => srchHit(searchText(tab, r), srchQ(q))).slice(0, 25);
  const body = $('#dBody');
  body.innerHTML = '<div class="d-results"></div>';
  const box = body.firstChild;
  if (!hits.length){ box.innerHTML = '<div class="none">No matches in this tab.</div>'; return; }
  hits.forEach(r => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'rrow';
    b.innerHTML = `<span class="t"><b>#${esc(r.key)}</b> ${esc(r.cells[1])}</span>
                   <span class="s">${esc(tab.id === 'quotes' ? r.cells[4] : r.cells[2])}</span>`;
    b.addEventListener('click', () => {
      state.drawerUid = r.uid;
      $('#dSearch').value = '';
      $('#dSearchWrap').classList.remove('has');
      renderDrawer();
      renderContent();
    });
    box.appendChild(b);
  });
  $('#dFoot').className = 'd-foot';
}

/* ---- Emails on a record: lazy view of the Email Actions tab -------------
   Fetched once per session, only when a drawer first needs it. Never part of
   loadAll or the localStorage cache. Rows without a record ref are ignored. */
let eaLoadPromise = null;
function loadEmailActions(){
  if (state.emailActions !== null) return Promise.resolve(state.emailActions);
  if (eaLoadPromise) return eaLoadPromise;
  eaLoadPromise = api(`/values/${encodeURIComponent(`'${CONFIG.EMAIL_ACTIONS_SHEET}'!A2:AB`)}`)
    .then(res => {
      state.emailActions = (res.values || []).map(row => ({
        q:   String(row[10] || '').trim(),
        j:   String(row[11] || '').trim(),
        cat: String(row[7]  || '').trim(),
        created: String(row[3] || '').trim(),
        summary: String(row[15] || '').trim(),
        ev:  String(row[17] || '').trim(),
        url: String(row[26] || '').trim()
      })).filter(x => x.q || x.j);
      return state.emailActions;
    })
    .catch(e => {
      eaLoadPromise = null;               // allow retry next drawer open
      if (e.message === 'auth') throw e;
      state.emailActions = null;
      return [];
    });
  return eaLoadPromise;
}

/* List-row indicator: records with matched email history get a count badge. */
function eaListBadge(tabId, key){
  if (isField()) return '';
  const n = state.emailRefCounts[(tabId === 'quotes' ? 'q:' : 'j:') + key] || 0;
  return n ? `<span class="badge b-gray" title="${n} email${n > 1 ? 's' : ''} on this record — open for history">📨 ${n}</span>` : '';
}

/* Pure: newest-first emails for one record. */
function eaRowsFor(list, tabId, key){
  return (list || [])
    .filter(x => tabId === 'quotes' ? x.q === key : x.j === key)
    .slice()
    .sort((a, b) => b.created.localeCompare(a.created));
}

function buildEmailSection(items){
  const sec = document.createElement('div');
  sec.className = 'd-sec';
  sec.innerHTML = `<h3>Emails <span class="badge b-gray" style="margin-left:4px">${items.length}</span></h3>`;
  const shown = items.slice(0, 6);
  shown.forEach(x => {
    const it = document.createElement('div');
    it.className = 'ea-item';
    it.innerHTML =
      `<span class="badge b-gray">${esc(x.created.slice(0, 10))}</span>` +
      `<span class="badge b-blue">${esc(x.cat)}</span>` +
      (x.url && low(state.email) === 'info@acefirela.com' ? ` <a href="${esc(x.url)}" target="_blank" rel="noopener" style="font-size:12px">Open in Gmail ↗</a>` : '') +
      `<div class="ea-sum">${esc(x.summary)}</div>` +
      (x.ev ? `<div class="ea-ev">“${esc(x.ev)}”</div>` : '');
    sec.appendChild(it);
  });
  if (items.length > shown.length){
    const more = document.createElement('div');
    more.style.cssText = 'font-size:12px;color:var(--muted);padding-top:6px';
    more.textContent = '+ ' + (items.length - shown.length) + ' older — see the Email Actions tab for the full history';
    sec.appendChild(more);
  }
  return sec;
}

function renderDrawer(){
  const r = rowByUid(state.drawerUid);
  const tab = tabOfUid(state.drawerUid) || TABS[0];
  const body = $('#dBody');
  if (!r){ body.innerHTML = '<div class="empty">Record not found — it may have been removed. Refresh the data.</div>'; syncFoot(null); return; }

  $('#dQuote').textContent = '#' + r.key;
  let dq = '';
  if (tab.id === 'quotes'){
    if (isClosed(r)) dq = 'u-closed';
    else {
      const d = daysNum(r);
      if (d !== null && d < 0) dq = 'u-exp';
      else if (d !== null && d <= 7) dq = 'u-soon';
    }
  }
  $('#dQuote').className = 'q' + (dq ? ' ' + dq : '');
  $('#dName').textContent = r.cells[1];
  const i = state.drawerList.indexOf(r.uid);
  $('#dPrev').disabled = i <= 0;
  $('#dNext').disabled = i < 0 || i >= state.drawerList.length - 1;

  body.innerHTML = '';

  /* v0.35: which frozen property this record belongs to. Hidden from Field
     accounts, which have no Properties screen to open. */
  const _pids = canSeeProperties() && window.propForRecord ? (window.propForRecord(tab.id, r.key) || []) : [];
  if (_pids.length){
    const pl = document.createElement('div');
    pl.className = 'd-prop';
    pl.innerHTML = '<span class="d-prop-lbl">Property</span>' +
      _pids.map(id => `<button type="button" class="r-pchip" data-pchip="${esc(id)}" title="Open ${esc(id)}">${esc(id)}</button>`).join('') +
      `<span class="d-prop-addr">${esc((window.propAddress && window.propAddress(_pids[0])) || '')}</span>` +
      (_pids.length > 1 ? '<span class="d-prop-addr">· spans ' + _pids.length + ' buildings</span>' : '');
    wirePropChips(pl);
    body.appendChild(pl);
  }

  /* outcome banner — closed quotes show their result before anything else (v0.27) */
  if (tab.id === 'quotes'){
    const oc = outcomeOf(r);
    if (oc){
      const k = outcomeKind(oc), won = k === 'won', post = k === 'post';
      const ocLbl = (state.headers.quotes || [])[16] || 'Outcome';
      const txt = outcomeText(oc);
      const bn = document.createElement('div');
      bn.className = 'd-outcome ' + outcomeClass(k);
      bn.innerHTML = `<span class="oc-ic">${won ? '✓' : post ? '⏸' : k === 'red' ? '⚠' : '✕'}</span>` +
        `<span>${k === 'lost' ? 'Closed — ' + esc(txt) : esc(txt)}</span>` +

      body.appendChild(bn);
    }
  }

  const acts = document.createElement('div');
  acts.className = 'd-actions';
  const email = tab.id === 'quotes' ? (r.cells[2]||'').trim() : '';
  const phone = tab.id === 'quotes' ? (r.cells[3]||'').trim() : '';
  const link  = tab.id === 'quotes' ? (r.cells[5]||'').trim() : '';
  if (phone) acts.insertAdjacentHTML('beforeend', `<a class="act-btn" href="tel:${esc(phone)}">📞 Call</a>`);
  const dPhone = phone || (state.customers[normName(r.cells[1])] || {}).phone || '';
  if (canContact() && dPhone && !prefNoText(r.cells[1])){
    const tb = document.createElement('button');
    tb.className = 'act-btn';
    tb.textContent = '💬 Text';
    tb.addEventListener('click', () => {
      if (tab.id === 'quotes') draftQuoteText(r);
      else openTexter({ phone:dPhone, name:r.cells[1], srcKey:r.key },
        `Hi ${String(r.cells[1]||'').split(',')[0].trim() || 'there'}, this is ACE Fire LA regarding job #${r.key}${r.cells[2] ? ' — ' + r.cells[2] : ''}. Call or text us at ${CONFIG.COMPANY_PHONE} with any questions.`, 'job');
    });
    acts.appendChild(tb);
  }
  if (canContact() && tab.id === 'quotes' && !prefNoContact(r.cells[1])){
    const db = document.createElement('button');
    db.className = 'act-btn';
    db.textContent = '✉ Draft email';
    db.addEventListener('click', () => draftQuoteEmail(r));
    acts.appendChild(db);
  } else if (email && canContact()) acts.insertAdjacentHTML('beforeend', `<a class="act-btn" href="mailto:${esc(email)}">✉ Email</a>`);

    jb.textContent = (otherId === 'tracker' ? '⇄ Open in Tracker' : '⇄ Open in Quotes');
    jb.addEventListener('click', () => switchToRecord(otherId, twin.uid));
    acts.appendChild(jb);
  }
  /* compact client history: one button, full timeline lives in the popup */

      (dPhone && x.key === phoneKey(dPhone)) || (x.name && normName(x.name) === nmK));
    const nMail = emailsForCustomer(r.cells[1]).length;
    const nAll = nMail + (thr ? thr.msgs.length : 0);

    if (isAdmin()) add('Total', esc(r.cells[7]));

    add('Status', r.cells[9] ? `<span class="badge b-gray">${esc(r.cells[9])}</span>` : '');
    add('Ember', (r.cells[14] || r.cells[15]) ? `${r.cells[15] ? `<span class="badge b-blue">${esc(r.cells[15])}</span> ` : ''}${esc(r.cells[14])}` : '');

    add('Wix', wixBadge(r.cells[4]));
    add('Invoice #', esc(r.cells[5]));
    add('Invoice', invStatusBadge(r.cells[6]));
    add('Ember', (r.cells[7] || r.cells[8]) ? `${r.cells[8] ? `<span class="badge b-blue">${esc(r.cells[8])}</span> ` : ''}${esc(r.cells[7])}` : '');
  }
  info.appendChild(grid);
  body.appendChild(info);

  /* Emails on this record — appears only once loaded and only if any match */

    const eaSlot = document.createElement('div');
    body.appendChild(eaSlot);
    const myUid = state.drawerUid;
    loadEmailActions().then(list => {
      if (state.drawerUid !== myUid || !eaSlot.isConnected) return;
      const items = eaRowsFor(list, tab.id, r.key);
      if (items.length) eaSlot.appendChild(buildEmailSection(items));
    }).catch(() => {});
  }

  const ed = document.createElement('div');
  ed.className = 'd-sec';
  ed.innerHTML = '<h3>Team updates</h3>';
  /* contact preference — per customer, saved instantly, applies to every record with this name */
  if (canContact()) {
    const f = document.createElement('div');

    f.appendChild(note);

  }
  const hdr = state.headers[tab.id] || [];
  const editCols = (isField() && tab.id === 'quotes') ? tab.editable.filter(c => c === 13) : tab.editable;   // field techs: job-walk notes only on quotes

  body.appendChild(ed);

  const related = [];
  const nm = normName(r.cells[1]);
  if (nm){
    TABS.forEach(t => (state.data[t.id]||[]).forEach(x => {
      if (x.uid !== r.uid && normName(x.cells[1]) === nm) related.push({ t, x });
    }));
  }
  if (related.length){
    const sec = document.createElement('div');
    sec.className = 'd-sec';
    sec.innerHTML = `<h3>Same customer (${related.length})</h3><div class="d-results"></div>`;
    const box = sec.querySelector('.d-results');
    related.slice(0, 8).forEach(({ t, x }) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'rrow';
      b.innerHTML = `<span class="t"><b>#${esc(x.key)}</b> ${esc(t.label)}</span>
                     <span class="s">${esc(t.id === 'quotes' ? x.cells[4] : x.cells[2])}</span>`;
      b.addEventListener('click', () => switchToRecord(t.id, x.uid));
      box.appendChild(b);
    });
    body.appendChild(sec);
  }

  if (CONFIG.ACTIVITY_LOG_SHEET){
    const sec = document.createElement('div');
    sec.className = 'd-sec';
    sec.innerHTML = '<h3>Recent activity</h3>';
    if (!state.activityLoaded){
      sec.insertAdjacentHTML('beforeend', '<div class="log-none">Loading activity…</div>');
    } else {

      if (!entries.length) sec.insertAdjacentHTML('beforeend', '<div class="log-none">No logged activity for this record yet — edits made here will appear.</div>');
      entries.forEach(a => sec.appendChild(logItemNode(a, { after: () => renderDrawer() })));
    }
    body.appendChild(sec);
  }

  syncFoot(r);
}
/* v0.35: shared tab switch so other modules (Properties) can navigate here. */
window.__gotoTab = function(tabId){

     hides Properties from Field accounts, and without this check a chip (or any
     future caller) would walk straight past that restriction. */

function propChipHtml(tabId, key){

function buildControl(tab, r, colIdx){
  const box = document.createElement('div');

  box.dataset.col = colIdx;
  const val = currentVal(r, colIdx);

  if (tab.id === 'quotes'){
    if (colIdx === 16){
      buildOutcomeControl(box, tab, r, colIdx);

    }

      ta.id = 'fld-' + colIdx;

      ta.placeholder = 'Notes…';
      ta.addEventListener('input', () => { setEdit(tab, r, colIdx, ta.value); autoGrowTA(ta); });
      box.appendChild(ta);
      requestAnimationFrame(() => autoGrowTA(ta));
      box.appendChild(chipRow(canContact() ? [
        { l:'+ ' + todayMD() + ' Sent email', v:() => appendLine(ta, todayMD() + ' Sent email,') },
        { l:'+ ' + todayMD() + ' Sent text',  v:() => appendLine(ta, todayMD() + ' Sent text:') },
        { l:'+ ' + todayMD() + ' Called',     v:() => appendLine(ta, todayMD() + ' Called,') }
      ] : [
        { l:'+ ' + todayMD() + ' Job walk',   v:() => appendLine(ta, todayMD() + ' Job walk:') },
        { l:'+ ' + todayMD() + ' Site note',  v:() => appendLine(ta, todayMD() + ' Site note:') }
      ], () => { setEdit(tab, r, colIdx, ta.value); autoGrowTA(ta); }));
      return box;
    }
    const inp = mkInput(val, 'e.g. ' + todayMD());
    inp.id = 'fld-' + colIdx;
    inp.addEventListener('input', () => setEdit(tab, r, colIdx, inp.value));
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') saveActive(); });
    box.appendChild(inp);
    box.appendChild(chipRow([
      { l: todayMD(),  v:() => inp.value = todayMD() },
      { l:'Not Sent',  v:() => inp.value = 'Not Sent' },
      { l:'X',         v:() => inp.value = 'X' }
    ], () => setEdit(tab, r, colIdx, inp.value)));
    return box;
  }

  const listOpts = state.options[colIdx];
  if (listOpts && listOpts.length){
    buildSelect(box, tab, r, colIdx, listOpts, val);
    return box;
  }
  const inp = mkInput(val, 'Type…');
  inp.id = 'fld-' + colIdx;

function mkInput(val, ph){
  const i = document.createElement('input');
  i.type = 'text'; i.value = val; i.placeholder = ph; i.autocomplete = 'off';
  return i;
}
function buildSelect(box, tab, r, colIdx, opts, val){
  box.innerHTML = '';
  const sel = document.createElement('select');
  sel.id = 'fld-' + colIdx;
  const all = [...opts];
  if (val && !all.includes(val)) all.unshift(val);
  sel.appendChild(new Option('— select —', ''));
  all.forEach(o => sel.appendChild(new Option(o, o)));
  sel.appendChild(new Option('✎ Type a custom answer…', '__custom__'));
  sel.value = all.includes(val) ? val : '';
  sel.addEventListener('change', () => {
    if (sel.value === '__custom__'){ toCustomInput(box, tab, r, colIdx, opts); return; }
    setEdit(tab, r, colIdx, sel.value);
  });

}
/* ---- Outcome control (v0.32) ----------------------------------------
   Answer (list or typed) + a green / yellow / red colour you pick yourself.
   The colour is saved in front of the answer ("🟡 Follow up on 8/5") so it
   sticks in the sheet, and it tints the quote in the list and the banner at
   the top of the panel — on any answer, not just Won and Postponed. */
function buildOutcomeControl(box, tab, r, colIdx){
  box.innerHTML = '';
  const start = currentVal(r, colIdx);
  let text  = outcomeText(start);
  let color = outcomeColor(start);

  const field = document.createElement('div');
  const swRow = document.createElement('div');
  swRow.className = 'sw-row';

  const push  = () => setEdit(tab, r, colIdx, withOutcomeColor(text, color));
  const paint = () => {
    swRow.querySelectorAll('.sw').forEach(b => {
      const on = b.dataset.color === color;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    swRow.classList.toggle('dim', !text);
  };

  function mountList(){
    field.innerHTML = '';
    const sel = document.createElement('select');
    sel.id = 'fld-' + colIdx;
    const all = [...OUTCOME_OPTIONS];
    if (text && !all.includes(text)) all.unshift(text);
    sel.appendChild(new Option('— select —', ''));
    all.forEach(o => sel.appendChild(new Option(o, o)));
    sel.appendChild(new Option('✎ Type a custom answer…', '__custom__'));
    sel.value = all.includes(text) ? text : '';
    sel.addEventListener('change', () => {
      if (sel.value === '__custom__'){ mountCustom(true); return; }
      text = sel.value;
      if (!text) color = '';          // cleared outcome reopens the quote — drop the colour too
      push(); paint();
    });
    field.appendChild(sel);
  }

  function mountCustom(focus){
    field.innerHTML = '';
    const inp = mkInput(text, 'e.g. Follow up on ' + todayMD());
    inp.id = 'fld-' + colIdx;
    const dlId = 'dl-custom-' + colIdx;
    ensureDatalist(dlId, [...new Set([...OUTCOME_OPTIONS, ...(state.suggest[colIdx] || []).map(outcomeText)])].filter(Boolean));
    inp.setAttribute('list', dlId);
    inp.addEventListener('input', () => {
      text = inp.value;
      if (!text.trim()) color = '';
      push(); paint();
    });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') saveActive(); });
    field.appendChild(inp);
    const back = document.createElement('button');
    back.className = 'backlist'; back.type = 'button'; back.textContent = '↩ back to list';
    back.addEventListener('click', () => { mountList(); paint(); });
    field.appendChild(back);
    if (focus) inp.focus();
  }

  OUTCOME_COLORS.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'sw sw-' + c.key;
    b.dataset.color = c.key;
    b.title = c.hint;
    b.setAttribute('aria-label', c.label + ' — ' + c.hint);
    b.innerHTML = '<i></i>' + c.label;
    b.addEventListener('click', () => {
      color = (color === c.key) ? '' : c.key;   // click the active colour again to clear it
      push(); paint();
    });
    swRow.appendChild(b);
  });

  box.appendChild(field);
  box.appendChild(swRow);
  const hint = document.createElement('div');
  hint.className = 'sw-hint';
  hint.textContent = 'Pick a colour to tint this quote in the list and on the banner above — tap it again to clear. It saves with the answer, e.g. “🟡 Follow up on ' + todayMD() + '”.';
  box.appendChild(hint);

  if (text && !OUTCOME_OPTIONS.includes(text)) mountCustom(false); else mountList();
  paint();
}

function toCustomInput(box, tab, r, colIdx, opts){
  box.innerHTML = '';
  const inp = mkInput('', 'Custom answer…');
  inp.id = 'fld-' + colIdx;
  const dlId = 'dl-custom-' + colIdx;
  ensureDatalist(dlId, [...new Set([...(opts||[]), ...(state.suggest[colIdx]||[])])]);

function ensureDatalist(id, options){

function chipRow(chips, after){

/* =====================================================================
   Save pipeline (drawer + quick-contact chips)
   ===================================================================== */
async function commitEdits(tab, r, changesObj, action = 'Edit (Dashboard)'){
  if (isField() && tab.id === 'quotes' && Object.keys(changesObj).some(c => +c !== 13)){
    throw new Error('Field accounts can only update notes on quotes');
  }
  /* duplicate quote #s make "which row?" ambiguous — refuse rather than risk updating the wrong one (v0.28) */
  if ((state.dupes[tab.id] || []).includes(r.key)){
    throw new Error(`#${r.key} appears more than once on ${tab.label} — fix the duplicate rows in the sheet, refresh, then save`);
  }
  let target = r.sheetRow;
  const chk = await api(`/values/${encodeURIComponent(`'${tab.sheet}'!A${target}`)}`);
  if (String(chk.values?.[0]?.[0] ?? '').trim() !== r.key){
    const colA = await api(`/values/${encodeURIComponent(`'${tab.sheet}'!A2:A`)}`);
    const matches = (colA.values || [])
      .map((x, i) => ({ v: String(x[0] ?? '').trim(), i }))
      .filter(x => x.v === r.key);
    if (!matches.length) throw new Error(`Row for quote ${r.key} not found — refresh and try again`);
    if (matches.length > 1) throw new Error(`Quote ${r.key} appears ${matches.length}× and rows shifted — refresh before saving`);
    target = matches[0].i + 2;
  }

  const changes = Object.entries(changesObj);
  await api('/values:batchUpdate', {
    method:'POST',
    body: JSON.stringify({
      valueInputOption:'USER_ENTERED',
      data: changes.map(([c, v]) => ({ range:`'${tab.sheet}'!${colLetter(+c)}${target}`, values:[[v]] }))
    })
  });

  if (CONFIG.ACTIVITY_LOG_SHEET){
    const hdr = state.headers[tab.id] || [];
    const details = changes.map(([c, v]) =>
      `${hdr[+c] || colLetter(+c)}: "${(r.cells[+c]||'').slice(0,60)}" → "${String(v).slice(0,60)}"`).join(' | ');
    const undoData = { t: tab.id, c: Object.fromEntries(changes.map(([c, v]) => [c, { o: r.cells[+c] || '', n: String(v) }])) };
    const entry = [new Date().toLocaleString(), state.email, action, tab.sheet, r.key, details, JSON.stringify(undoData)];
    state.activity.push(entry);
    logActivityAppend(entry);
  }

  changes.forEach(([c, v]) => r.cells[+c] = v);
  r.sheetRow = target;
  saveCache();
}

/* =====================================================================
   Renewals radar — recurring Reg 4 service, computed from completed jobs
   ===================================================================== */
/* order matters: specific periods before 'annual' (which would match 'semi-annual') */
const CYCLES = [
  { re:/5[\s-]?(year|yr)/i,      months:60, label:'5-Year' },
  { re:/3[\s-]?(year|yr)/i,      months:36, label:'3-Year' },
  { re:/semi[\s-]?annual/i,      months:6,  label:'Semi-Annual' },
  { re:/quarter/i,               months:3,  label:'Quarterly' },
  { re:/month/i,                 months:1,  label:'Monthly' },
  { re:/annual|yearly|title\s*19/i, months:12, label:'Annual' }
];
const CATS = [
  ['Fire Alarm',          /alarm|supervising/i],
  ['Fire Sprinkler',      /sprinkler|title\s*19/i],
  ['Standpipe',           /standpipe|class\s+(i{1,3})\b/i],
  ['Fire Pump',           /fire\s*pump|pump\s*run/i],
  ['Backflow',            /backflow/i],
  ['Emergency Lighting',  /emergency\s*light|exit\s*(light|sign)/i]
];
function addMonths(d, m){
  const x = new Date(d.getFullYear(), d.getMonth() + m, d.getDate());
  return x;
}
const fmtFull = d => (d.getMonth()+1) + '/' + d.getDate() + '/' + d.getFullYear();
function cycleOf(text){
  const hits = CYCLES.filter(c => c.re.test(text));
  if (!hits.length) return null;
  return hits.reduce((a, b) => a.months <= b.months ? a : b);   // shortest period = next touchpoint
}
function catOf(text){
  for (const [name, re] of CATS) if (re.test(text)) return name;
  return 'Fire Protection';
}

let _ren = { ts:-1, list:[] };
function computeRenewals(){
  if (_ren.ts === state.lastLoad) return _ren.list;
  const today = startOfDay(new Date());
  const tracker = state.data.tracker || [];
  const quotes = state.data.quotes || [];

  // latest service per customer + category + cycle — from live completed jobs AND archived (paid) history
  const sources = [];
  tracker.forEach(r => { if (low(r.cells[3]) === 'completed') sources.push({ cells:r.cells, src:r }); });
  (state.archive || []).forEach(r => sources.push({ cells:r.cells, src:null }));

  const best = new Map();
  sources.forEach(({ cells, src }) => {
    const d = parseDate(cells[7]);
    if (!d) return;
    const text = (cells[2] || '') + ' ' + (cells[8] || '');
    const cyc = cycleOf(text);
    if (!cyc) return;                       // repairs / service calls have no cycle keyword
    const cat = catOf(text);
    const key = normName(cells[1]) + '|' + cat + '|' + cyc.months;
    const prev = best.get(key);
    if (!prev || d > prev.last) best.set(key, { src, srcKey:String(cells[0]||'').trim(), name:cells[1], last:d, cyc, cat });
  });

  const list = [...best.values()].map(({ src, srcKey, name, last, cyc, cat }) => {
    const nm = normName(name);
    const due = addMonths(last, cyc.months);
    const days = Math.round((due - today) / DAY);

    // already scheduled again? (future tracker job, same customer + category)
    const upcoming = tracker.some(r => {
      if ((src && r.uid === src.uid) || low(r.cells[3]) === 'cancelled') return false;
      const d2 = parseDate(r.cells[7]);
      return d2 && d2 > today && normName(r.cells[1]) === nm &&
             catOf((r.cells[2]||'') + ' ' + (r.cells[8]||'')) === cat;
    });

    // active quote already out? (same customer + category, not expired)
    let quote = null;
    quotes.forEach(q => {
      if (normName(q.cells[1]) !== nm) return;
      if (catOf(q.cells[4] || '') !== cat) return;
      if (outcomeOf(q)) return;   // quote closed (declined / no longer needed / …)
      const dn = daysNum(q);
      if (dn !== null && dn < 0) return;    // expired
      if (!quote || quoteNum(q.key) > quoteNum(quote.key)) quote = q;
    });

    // team-marked outcome? (✕ Dismiss — saved in the Renewal Status tab)
    const rkey = nm + '|' + cat + '|' + cyc.months;
    const st = state.renStatus[rkey];
    let dismissed = false, dstatus = '';
    if (st && st.status){
      if (/lost/i.test(st.status)){
        dismissed = !st.lastAtMark || last <= st.lastAtMark;   // a newer completed job revives the customer
      } else {
        const mark = st.dueAtMark || due;
        dismissed = due <= mark && today < addMonths(mark, cyc.months);   // snoozed until the next cycle comes due
      }
      if (dismissed) dstatus = st.status;
    }

    // contact info: Customers directory first, then newest live quote, then archived quotes
    let email = '', phone = '';
    const hit = state.customers[nm];
    if (hit){ email = hit.email || ''; phone = hit.phone || ''; }
    const contactScan = rows => {
      for (let i = rows.length - 1; i >= 0; i--){
        const q = rows[i];
        if (normName(q.cells[1]) !== nm) continue;
        if (!email && (q.cells[2]||'').includes('@')) email = q.cells[2].trim();
        if (!phone && (q.cells[3]||'').trim()) phone = q.cells[3].trim();
        if (email && phone) break;
      }
    };
    if (!email || !phone) contactScan(quotes);
    if (!email || !phone) contactScan(state.qarchive || []);

    return { name, cat, cyc, last, due, days, src, srcKey, upcoming, quote, email, phone, rkey, dismissed, dstatus };
  }).sort((a, b) => a.due - b.due);

  _ren = { ts: state.lastLoad, list };
  return list;
}

function renderRenewals(){
  const main = $('#main');
  main.innerHTML = '';
  const buckets = {
    overdue:   x => x.days < 0 && !x.dismissed,
    d30:       x => x.days >= 0 && x.days <= 30 && !x.dismissed,
    d90:       x => x.days > 30 && x.days <= 90 && !x.dismissed,
    later:     x => x.days > 90 && !x.dismissed,
    dismissed: x => x.dismissed,
    all:       () => true
  };
  const fn = buckets[state.renBucket] || buckets.d30;
  let items = computeRenewals().filter(fn);
  const q = srchQ(state.search);
  if (q) items = items.filter(x => srchHit(x.name + ' ' + x.cat + ' ' + x.cyc.label + ' ' + x.srcKey, q));

  const list = document.createElement('div');
  list.className = 'list';
  if (!items.length){
    list.innerHTML = `<div class="empty">${q ? 'No renewals match your search.' :
      state.renBucket === 'dismissed' ? 'No dismissed renewals — use ✕ Dismiss on a renewal when the customer declines or is lost.' :
      'Nothing in this window — renewals appear automatically from completed jobs with a service cycle (annual, 5-year, monthly…).'}</div>`;
    main.appendChild(list);
    return;
  }
  items.forEach(x => {
    const row = document.createElement('div');
    row.setAttribute('role', 'button');
    row.tabIndex = 0;
    row.className = 'row' + (x.dismissed ? ' u-closed' : x.days < 0 ? ' u-exp' : x.days <= 30 ? ' u-soon' : '');
    const dueBadge = x.dismissed
      ? `<span class="badge b-gray">was due ${fmtMD(x.due)}</span>`
      : x.days < 0
      ? `<span class="badge b-red">${Math.abs(x.days)}d overdue</span>`
      : x.days <= 30
        ? `<span class="badge b-amber">due in ${x.days}d</span>`
        : `<span class="badge ${x.days <= 90 ? 'b-blue' : 'b-gray'}">due ${fmtMD(x.due)}</span>`;
    row.setAttribute('aria-label', `${x.name} — ${x.cyc.label} ${x.cat} due ${fmtFull(x.due)}`);
    const metaActions = x.dismissed
      ? `<span class="badge b-gray">✕ ${esc(x.dstatus)}</span><button type="button" class="fu" data-act="restore" title="Bring this renewal back into the active lists">↩ Restore</button>`
      : (prefNoContact(x.name) ? '' : '<button type="button" class="fu draft" data-act="draft">✉ Draft outreach</button>') +
        (x.phone ? `<a class="fu" href="tel:${esc(x.phone)}" data-act="tel">📞 Call</a>` : '') +
        (x.phone && !prefNoText(x.name) ? `<button type="button" class="fu draft" data-act="rentext" title="Draft & send a renewal text">💬 Text</button>` : '') +
        (x.quote ? `<span class="badge b-blue">Quote #${esc(x.quote.key)} out</span>` : '') +
        (x.upcoming ? `<span class="badge b-green">Already scheduled</span>` : '') +
        `<span class="ren-dm"><button type="button" class="fu" data-act="dismiss" title="Mark as declined or lost — removes it from the counts">✕ Dismiss</button></span>`;
    row.innerHTML = `
      <div class="r-main">
        <div class="r-top">
          <span class="r-nm">${esc(x.name)}</span>
          <span class="badge b-gray">${esc(x.cyc.label)}</span>
          <span class="r-side">${dueBadge}</span>
        </div>
        <div class="r-ttl">${esc(x.cat)} — last serviced ${fmtFull(x.last)} · job #${esc(x.srcKey)}${x.src ? '' : ' (archived)'}</div>
        <div class="r-meta">
          ${prefBadge(x.name)}${metaActions}
        </div>
      </div>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>`;
    if (x.src){
      row.addEventListener('click', () => openDrawer(x.src.uid));
      row.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openDrawer(x.src.uid); } });
    } else {
      row.removeAttribute('role');
      row.removeAttribute('tabindex');
      row.style.cursor = 'default';
      const ch = row.querySelector('.chev');
      if (ch) ch.remove();
    }
    row.querySelectorAll('[data-act]').forEach(el => {
      el.addEventListener('click', e => {
        e.stopPropagation();
        if (el.dataset.act === 'draft') draftOutreach(x, el);
        if (el.dataset.act === 'rentext') openTexter({ phone:x.phone, name:x.name, srcKey:x.srcKey }, smsRenewalTemplate(x), 'renewal');

      });

    });
    list.appendChild(row);
  });
  main.appendChild(list);

/* ---- renewal outcomes (✕ Dismiss — saved in the Renewal Status tab) ----
   "Declined this cycle" snoozes the item until the next cycle comes due, then it
   resurfaces on its own; "Lost customer" hides it until a new completed job revives

function renDismissMenu(row, x){
  const wrap = row.querySelector('.ren-dm');
  if (!wrap) return;
  wrap.innerHTML =
    '<button type="button" class="fu">Declined this cycle</button>' +
    '<button type="button" class="fu">Lost customer</button>' +
    '<button type="button" class="fu off">Cancel</button>';
  const [b1, b2, b3] = wrap.querySelectorAll('button');
  [b1, b2, b3].forEach(b => b.addEventListener('keydown', e => e.stopPropagation()));
  b1.addEventListener('click', e => { e.stopPropagation(); saveRenewalStatus(x, 'Declined this cycle'); });
  b2.addEventListener('click', e => { e.stopPropagation(); saveRenewalStatus(x, 'Lost customer'); });

}

async function saveRenewalStatus(x, status){
  const when = new Date().toLocaleString();
  const vals = [x.rkey, x.name, x.cyc.label + ' ' + x.cat, status, fmtFull(x.due), fmtFull(x.last), autoSenderName(), when];
  const hit = state.renStatus[x.rkey];
  try {
    if (hit && hit.row){
      await api('/values:batchUpdate', { method:'POST',
        body: JSON.stringify({ valueInputOption:'USER_ENTERED',
          data:[{ range:`'${CONFIG.RENEWAL_STATUS_SHEET}'!A${hit.row}:H${hit.row}`, values:[vals] }] }) });
      Object.assign(hit, { status, dueAtMark: new Date(x.due), lastAtMark: new Date(x.last) });
    } else {
      const doAppend = () => api(`/values/${encodeURIComponent(`'${CONFIG.RENEWAL_STATUS_SHEET}'!A:H`)}:append?valueInputOption=USER_ENTERED`, {
        method:'POST', body: JSON.stringify({ values:[vals] }) });
      let res;
      try { res = await doAppend(); }
      catch(e){
        if (e.message === 'auth') throw e;
        await ensureRenewalStatusTab();   // first ever dismissal — create the tab, then retry
        res = await doAppend();
      }
      const m = String(res.updates ? res.updates.updatedRange : '').match(/![A-Z]+(\d+):/);
      state.renStatus[x.rkey] = { status, dueAtMark: new Date(x.due), lastAtMark: new Date(x.last), row: m ? +m[1] : 0 };
    }
    _ren.ts = -1;   // renewals cache is stale — recompute on next render
    saveCache();
    if (CONFIG.ACTIVITY_LOG_SHEET){
      const entry = [when, state.email, 'Renewal outcome', 'Renewals', x.srcKey || '',
        x.name + ' — ' + x.cyc.label + ' ' + x.cat + ' → ' + (status || 'restored'), ''];
      state.activity.push(entry);
      logActivityAppend(entry);
    }
    renderAll();
    toast(status ? `${x.name} — ${status.toLowerCase()}` : `${x.name} — renewal restored`, 'ok');
  } catch(e){
    if (e.message !== 'auth') toast('Could not save renewal outcome: ' + e.message, 'err');
  }
}

function b64url(str){
  return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function gmailSend(to, subject, body, from, replyTo, retry = true){
  /* strip CR/LF from header values — a pasted address can't inject extra headers
     (the subject is already neutralized by its base64 encoding below) */
  const hdr = v => String(v || '').replace(/[\r\n]+/g, ' ').trim();
  to = hdr(to); from = hdr(from); replyTo = hdr(replyTo);
  const encSubj = '=?UTF-8?B?' + btoa(unescape(encodeURIComponent(subject))) + '?=';
  const raw = 'To: ' + to + '\r\n' +
    (from ? 'From: ' + from + '\r\n' : '') +
    (replyTo ? 'Reply-To: ' + replyTo + '\r\n' : '') +
    'Subject: ' + encSubj +
    '\r\nMIME-Version: 1.0\r\nContent-Type: text/plain; charset="UTF-8"\r\n\r\n' + body;
  const r = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send', {
    method:'POST',
    headers:{ Authorization:'Bearer ' + state.token, 'Content-Type':'application/json' },
    body: JSON.stringify({ raw: b64url(raw) })
  });
  if (r.status === 401 && retry){
    const ok = await silentToken(state.email);
    if (ok) return gmailSend(to, subject, body, from, replyTo, false);
    throw new Error('Session expired — sign in again, then retry');
  }
  if (r.status === 403){
    throw new Error('Gmail permission missing — sign out & back in to approve email sending (and confirm the Gmail API is enabled in the Google Cloud project)');
  }
  if (!r.ok){
    let msg = 'Send failed (' + r.status + ')';
    try { msg = (await r.json()).error?.message || msg; } catch(e){}
    throw new Error(msg);
  }
}
function logEmail(person, fromAlias, to, subject, replyTo){

async function aiRewrite(channel){
  const isMail = channel === 'email';
  const instr = $(isMail ? '#mAi' : '#sAi').value.trim();
  if (!instr){ toast('Type how you want the message changed', 'err'); return; }
  const url = String(CONFIG.PRIORITIES_URL || '').trim();
  if (!url){ toast('AI rewrite needs the Priorities service — set CONFIG.PRIORITIES_URL', 'err'); return; }
  const btn = $(isMail ? '#mAiGo' : '#sAiGo');
  const was = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Rewriting…';
  try {
    const ctx = {};
    const r = isMail ? (mailCtx && mailCtx._quoteRow) : (smsCtx && smsCtx._quoteRow);
    if (r){
      ctx.quote = r.key;
      ctx.customer = r.cells[1] || '';
      ctx.title = r.cells[4] || '';
      ctx.expDate = r.cells[6] || '';
      ctx.daysToExp = daysNum(r);
    } else {
      const c = isMail ? mailCtx : smsCtx;
      if (c && c.name) ctx.customer = c.name;
      if (c && c.srcKey) ctx.ref = c.srcKey;
    }
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 25000);
    const resp = await fetch(url, { method:'POST', body: JSON.stringify({
      action:'rewrite', token: state.token, channel,
      subject: isMail ? $('#mSubj').value : '',
      body: $(isMail ? '#mBody' : '#sBody').value,
      instruction: instr, context: ctx
    }), signal: ctl.signal });
    clearTimeout(to);
    const txt = await resp.text();
    let j = null;
    try { j = JSON.parse(txt); }
    catch(e){ throw new Error('The Priorities service returned a page instead of data — check it\u2019s deployed with access set to "Anyone"'); }
    if (!j || !j.success || !j.body) throw new Error((j && j.error) || 'Rewrite failed — is the Priorities service on v1.3+?');
    if (isMail){
      mailPrev = { subject: $('#mSubj').value, body: $('#mBody').value };
      if (j.subject) $('#mSubj').value = j.subject;
      $('#mBody').value = j.body;
      $('#mUndo').style.display = '';
      setMailSource('ai');
      mailDirty = true;
      syncSendBtn();
    } else {
      smsPrev = $('#sBody').value;
      $('#sBody').value = j.body;
      $('#sUndo').style.display = '';
      setSmsSource('ai');
      smsDirty = true;
      smsSegInfo();
      syncSmsBtn();
    }
  } catch(e){
    toast(e.name === 'AbortError' ? 'AI rewrite timed out — try again' : String(e.message || e), 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = was;
  }
}

/* ---- Texts tab: conversations threaded from SMS Outbox + SMS Inbox ---- */
const phoneKey = v => {
  let d = String(v || '').replace(/\D/g, '');
  if (d.length === 11 && d[0] === '1') d = d.slice(1);
  return d.length >= 10 ? d.slice(-10) : d;
};
const fmtPhone = k => k.length === 10 ? '(' + k.slice(0,3) + ') ' + k.slice(3,6) + '-' + k.slice(6) : k;
const fmtClock = d => {
  let h = d.getHours(); const m = String(d.getMinutes()).padStart(2, '0');
  const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
  return h + ':' + m + ' ' + ap;
};
function shortWhen(ts, raw){
  if (!ts) return String(raw || '').split(',')[0];
  const d = new Date(ts), now = new Date();
  if (d.toDateString() === now.toDateString()) return fmtClock(d);
  return (d.getMonth() + 1) + '/' + d.getDate();
}
function phoneNameMap(){
  const map = {};
  const add = (ph, nm) => {
    const k = phoneKey(ph);
    if (k.length === 10 && nm && !map[k]) map[k] = String(nm).trim();
  };
  Object.entries(state.customers || {}).forEach(([nm, v]) =>
    add(v.phone, nm.replace(/\b\w/g, c => c.toUpperCase())));
  (state.data.quotes || []).forEach(r => add(r.cells[3], r.cells[1]));
  (state.qarchive || []).forEach(r => add(r.cells[3], r.cells[1]));
  return map;
}
function computeThreads(){
  const th = {};
  const touch = k => th[k] || (th[k] = { key:k, name:'', msgs:[], unread:0 });
  (state.smsOut || []).forEach(r => {
    const st = String(r.cells[7] || '').toUpperCase();
    if (st === 'PREVIEW' || st === 'SKIPPED' || st === 'EXCLUDED') return;   // reminder-queue rows live in the panel, not the thread
    const k = phoneKey(r.cells[2]);
    if (k.length < 10) return;
    const t = touch(k);
    if (!t.name && r.cells[3]) t.name = r.cells[3];
    t.msgs.push({
      dir:'out', ts: Date.parse(r.cells[0]) || 0, time:r.cells[0],
      body:r.cells[6], status:String(r.cells[7] || '').toUpperCase(),
      person:r.cells[1], type:r.cells[5], ref:r.cells[4]
    });
  });
  (state.smsIn || []).forEach(r => {
    const k = phoneKey(r.cells[1]);
    if (k.length < 10) return;
    const t = touch(k);
    if (!t.name && r.cells[2]) t.name = r.cells[2];
    const read = !!String(r.cells[5] || '').trim();
    if (!read) t.unread++;
    t.msgs.push({ dir:'in', ts: Date.parse(r.cells[0]) || 0, time:r.cells[0], body:r.cells[3], read, sheetRow:r.sheetRow });
  });
  const pn = phoneNameMap();
  return Object.values(th).filter(t => t.msgs.length).map(t => {
    t.msgs.sort((a, b) => a.ts - b.ts);
    t.last = t.msgs[t.msgs.length - 1];
    t.phone = fmtPhone(t.key);
    if (!t.name) t.name = pn[t.key] || '';
    const ds = state.threadDone[t.key];
    t.done = !!(ds && ds.done && t.last && t.last.ts <= ds.ts);   // any newer message reopens the thread automatically
    return t;
  }).sort((a, b) => (b.last ? b.last.ts : 0) - (a.last ? a.last.ts : 0));
}
function renderTexts(){

  if (tf === 'unread') items = items.filter(t => t.unread > 0);

          ${t.done ? '<span class="badge b-green">Done</span>' : ''}
          <button type="button" class="fu ${t.done ? '' : 'draft'}" data-act="tdone">${t.done ? '↺ Reopen' : '✓ Done'}</button>
        </div>
      </div>

    row.addEventListener('click', () => openThread(t.key));

    const db = row.querySelector('[data-act="tdone"]');
    if (db){
      db.addEventListener('click', e => { e.stopPropagation(); markThreadDone(t, !t.done, db); });
      db.addEventListener('keydown', e => e.stopPropagation());

  main.appendChild(list);
}

/* ---- Open / Done per conversation (Thread Status tab) ----
   Done drops the thread out of the default Open list. Any NEWER message
   (usually a client reply) reopens it automatically — nothing to clean up. */
async function markThreadDone(t, done, btn){
  if (btn) btn.disabled = true;
  const who = autoSenderName();
  const when = done ? new Date().toLocaleString() : '';
  const rec = state.threadDone[t.key];
  try {
    if (rec && rec.row){
      await api('/values:batchUpdate', {
        method:'POST',
        body: JSON.stringify({ valueInputOption:'USER_ENTERED',
          data:[{ range:`'${CONFIG.THREAD_STATUS_SHEET}'!A${rec.row}:D${rec.row}`, values:[[t.key, done ? 'DONE' : '', when, who]] }] })
      });
      rec.done = done;
      rec.ts = done ? Date.now() : 0;
    } else {
      const res = await api(`/values/${encodeURIComponent(`'${CONFIG.THREAD_STATUS_SHEET}'!A:D`)}:append?valueInputOption=USER_ENTERED`, {
        method:'POST', body: JSON.stringify({ values:[[t.key, done ? 'DONE' : '', when, who]] })
      });
      const m = String(res.updates ? res.updates.updatedRange : '').match(/![A-Z]+(\d+):/);
      state.threadDone[t.key] = { done, ts: done ? Date.now() : 0, row: m ? +m[1] : 0 };
    }

/* emails sent to this customer, matched via their email address

   so rotation is handled by simply re-reading it on the next frame. On

(function(){

      if (TC.me){ return loadRecent().then(function(){ subscribe(); }); }
    }).then(function(){ renderSection(); refreshBadges(); });
  }
  function mountGoogleButton(el){
    if (!(window.google && google.accounts && google.accounts.id)){
      el.innerHTML = '<div class="tc-note">Google sign-in is still loading \u2014 reopen this record in a moment.</div>';
      return;
    }
    var raw = crypto.randomUUID() + '-' + crypto.randomUUID();
    crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw)).then(function(buf){
      var hashed = Array.prototype.map.call(new Uint8Array(buf), function(b){ return b.toString(16).padStart(2,'0'); }).join('');
      google.accounts.id.initialize({
        client_id: CONFIG.CLIENT_ID,
        nonce: hashed,
        callback: function(resp){
          sb.auth.signInWithIdToken({ provider:'google', token: resp.credential, nonce: raw })
            .then(function(res){ if (res.error) throw res.error; })
            .catch(function(e){ console.warn('TeamChat sign-in', e); notify('Chat sign-in failed: ' + (e.message || e), 'err'); });
        }
      });
      google.accounts.id.renderButton(el, { theme:'outline', size:'medium', text:'signin_with', shape:'pill' });
    });
  }

  /* ---------- data ---------- */

      .catch(function(e){ console.warn('TeamChat roster', e); TC.roster = []; TC.rosterErr = true; });

  function loadRecent(){
    var since = new Date(Date.now() - 45 * 864e5).toISOString();
    return Promise.all([
      sb.from('team_chat_messages').select('*').gte('created_at', since).order('created_at', { ascending:false }).limit(400),

    ]).then(function(rs){
      if (rs[0].error) throw rs[0].error;

      TC.recent = rs[0].data || [];
      TC.reads = {};
      (rs[1].data || []).forEach(function(x){ TC.reads[x.record_id] = x.last_read_at; });

    }).catch(function(e){ console.warn('TeamChat recent', e); });
  }
  function mentionsMe(m){
    return !!(TC.me && (m.mentions || []).some(function(n){ return String(n).toLowerCase() === TC.me.display_name.toLowerCase(); }));
  }
  function computeUnread(){
    var un = {}, mention = 0;
    if (TC.me) TC.recent.forEach(function(m){
      if (m.sender_email === TC.me.email) return;
      var lr = TC.reads[m.record_id];
      if (!lr || new Date(m.created_at) > new Date(lr)){
        un[m.record_id] = (un[m.record_id] || 0) + 1;
        if (mentionsMe(m)) mention++;
