  function loadParts(key){
    return sb.from('conversation_participants').select('user_email,added_by,created_at').eq('record_id', key).order('created_at')
      .then(function(res){ if (res.error) throw res.error; TC.parts[key] = res.data || []; })
      .catch(function(e){ console.warn('TeamChat participants', e); });
  }
  function loadPipeline(key){
    return Promise.all([
      sb.from('media_processing').select('id,attachment_id,status,error,transcript').eq('record_id', key),
      sb.from('ai_reports').select('*').eq('record_id', key)
    ]).then(function(rs){
      ((rs[0] && rs[0].data) || []).forEach(function(p){ if (p.attachment_id) TC.procByAtt[p.attachment_id] = p; });
      ((rs[1] && rs[1].data) || []).forEach(function(r){ if (r.attachment_id) TC.repByAtt[r.attachment_id] = r; });
      TC.pipeKeys[key] = true;
    }).catch(function(e){ console.warn('TeamChat pipeline', e); });
  }
  function loadThread(key){
    /* concurrent callers share ONE in-flight promise — returning a fresh resolved
       promise here caused an instant re-render loop that froze the page when
       jumping between records with the drawer open */
    if (TC.threadLoading[key]) return TC.threadLoading[key];
    var p = Promise.all([
      sb.from('team_chat_messages').select('*').eq('record_id', key).order('created_at').limit(300)
        .then(function(res){ if (res.error) throw res.error; TC.msgs[key] = res.data || []; delete TC.threadErr[key]; }),
      loadParts(key),
      loadPipeline(key)
    ]).catch(function(e){ console.warn('TeamChat thread', e); TC.threadErr[key] = true; })
      .then(function(){ TC.threadLoading[key] = null; });
    TC.threadLoading[key] = p;
    return p;
  }
  function markRead(key, force){
    if (!TC.me) return;
    if (!force && !TC.unread[key] && TC.reads[key]) return;
    var now = new Date().toISOString();
    TC.reads[key] = now; computeUnread(); refreshBadges();
    sb.from('team_chat_reads').upsert({ user_email: TC.me.email, record_id:String(key), last_read_at: now })
      .then(function(res){ if (res && res.error) console.warn('TeamChat markRead', res.error); }, function(e){ console.warn('TeamChat markRead', e); });
  }
  function parseMentions(text, key){
    var out = [], allowed = partMembers(key);
    allowed.forEach(function(m){
      if (m.display_name && new RegExp('@' + reName(m.display_name) + '(\\b|$)', 'i').test(text)) out.push(m.display_name);
    });
    return out;
  }

  /* ---------- file service relay (Apps Script; verifies the Supabase session server-side) ---------- */
  function relay(action, payload){
    if (!UPLOAD_URL) return Promise.reject(new Error('Uploads not configured'));
    return sb.auth.getSession().then(function(res){
      var tok = res && res.data && res.data.session && res.data.session.access_token;
      if (!tok) throw new Error('Chat session expired \u2014 sign in again');
      var body = Object.assign({ action: action, token: tok }, payload || {});
      /* no custom headers = simple CORS request; Apps Script can't answer preflight OPTIONS */
      return fetch(UPLOAD_URL, { method:'POST', body: JSON.stringify(body) });
    }).then(function(r){
      if (!r.ok) throw new Error('File service error (' + r.status + ')');
      return r.text();
    }).then(function(txt){
      var j = null;
      try { j = JSON.parse(txt); }
      catch(e){ throw new Error('The upload endpoint returned a page instead of data \u2014 check the web app is deployed with access set to "Anyone"'); }
      if (!j || !j.success){
        var msg = (j && j.error) || 'File service call failed';
        if (/unknown action/i.test(msg)) msg = 'The file service is running old code \u2014 paste ChatFiles.gs v2 and deploy a New version';
        throw new Error(msg);
      }
      return j;
    });
  }

  /* ---------- attachments: pending list, single-shot + resumable uploads ---------- */
  function kindOfFile(f){
    var m = String(f.type || '').toLowerCase();
    if (/^audio\//.test(m)) return 'voice';
    if (/^video\//.test(m)) return 'video';
    if (/^image\//.test(m)) return 'image';
    if (m === 'application/pdf') return 'plan';
    return 'file';
  }
  function addPend(key, file, kind, duration){
    pend[key] = pend[key] || [];
    if (pend[key].length >= MAX_ITEMS){ notify('Up to ' + MAX_ITEMS + ' attachments per message', 'err'); return; }
    if (file.size > MAX_FILE_BYTES){ notify('File too large \u2014 1 GB max', 'err'); return; }
    if ((kind === 'video' || kind === 'voice') && file.size > MAX_AI_BYTES){
      notify('Heads up: over 200 MB, so it will upload but skip the automatic report', 'err');
    }
    pend[key].push({ uid: ++pendUid, file: file, name: file.name || 'attachment', size: file.size,
      type: file.type || '', kind: kind || kindOfFile(file), duration: duration != null ? duration : null,
      status: 'ready', pct: 0, offset: 0, uploadUrl: null, attachmentId: null, att: null, error: null, canceled: false, xhr: null });
    renderSection();
  }
  function readB64(file){
    return new Promise(function(resolve, reject){
      var rd = new FileReader();
      rd.onload = function(){ var v = String(rd.result || ''); resolve(v.slice(v.indexOf(',') + 1)); };
      rd.onerror = function(){ reject(new Error('Could not read the file')); };
      rd.readAsDataURL(file);
    });
  }
  function setPct(item, pct){
    item.pct = Math.max(item.pct, Math.min(100, Math.round(pct)));
    var bar = byId('tcPb_' + item.uid);
    if (bar){ bar.parentNode.style.display = 'block'; bar.style.width = item.pct + '%'; }
    var st = byId('tcPs_' + item.uid);
    if (st) st.textContent = item.pct + '%';
  }
  function metaFor(item, rec, tabId, key){
    return { record_type: tabId === 'tracker' ? 'job' : 'quote', record_id: String(key),
      record_name: String((rec.cells && rec.cells[1]) || ''), kind: item.kind, filename: item.name,
      mimeType: item.type || 'application/octet-stream', size: item.size, duration: item.duration };
  }
  function legacyUpload(meta, item){
    return readB64(item.file).then(function(b64){
      return relay('chatUpload', Object.assign({}, meta, { data: b64 }));
    }).then(function(j){ setPct(item, 100); return j.attachment; });
  }
  function putChunk(item, start, end, total, onProg){
    return new Promise(function(resolve, reject){
      var x = new XMLHttpRequest();
      x.open('PUT', item.uploadUrl);
      x.setRequestHeader('Content-Range', 'bytes ' + start + '-' + (end - 1) + '/' + total);
      x.upload.onprogress = function(e){ if (onProg && e.loaded) onProg(e.loaded); };
      x.onload = function(){ item.xhr = null; resolve({ status: x.status, text: x.responseText }); };
      x.onerror = function(){ item.xhr = null; reject(new Error('network')); };
      x.onabort = function(){ item.xhr = null; reject(new Error('canceled')); };
      item.xhr = x;
      x.send(item.file.slice(start, end));
    });
  }
  function resumableUpload(meta, item){
    var initP = item.uploadUrl
      ? Promise.resolve()
      : relay('initUpload', meta).then(function(j){ item.uploadUrl = j.uploadUrl; item.attachmentId = j.attachmentId; item.offset = 0; });
    return initP.then(function(){ return pushChunks(meta, item); })
      .then(function(fileId){ return relay('finalizeUpload', { attachmentId: item.attachmentId, fileId: fileId }); })
      .then(function(j){ return j.attachment; });
  }
  function pushChunks(meta, item){
    var size = item.size, tries = 0;
    function step(){
      if (item.canceled) return Promise.reject(new Error('canceled'));
      var off = item.offset || 0;
      var end = Math.min(off + CHUNK, size);
      return putChunk(item, off, end, size, function(loaded){ setPct(item, (off + loaded) / size * 100); })
        .then(function(r){
          if (r.status === 308){ item.offset = end; tries = 0; return step(); }
          if (r.status === 200 || r.status === 201){
            var f = {}; try { f = JSON.parse(r.text); } catch(e){}
            if (!f.id) throw new Error('Drive did not confirm the upload');
            setPct(item, 100);
            return f.id;
          }
          throw new Error('Upload chunk failed (' + r.status + ')');
        })
        .catch(function(e){
          if (item.canceled || String(e && e.message) === 'canceled') throw new Error('canceled');
          tries++;
          if (tries > 3) throw new Error(e.message || 'Upload failed');
          /* ask Drive (via the relay) where the session really stands, then resume */
          return relay('checkUpload', { uploadUrl: item.uploadUrl, size: size, attachmentId: item.attachmentId }).then(function(j){
            if (j.done && j.fileId){ setPct(item, 100); return j.fileId; }
            if (j.expired){
              item.uploadUrl = null; item.offset = 0;
              return relay('initUpload', meta).then(function(ji){ item.uploadUrl = ji.uploadUrl; item.attachmentId = ji.attachmentId; return step(); });
            }
            item.offset = j.offset || 0;
            return step();
          });
        });
    }
    return step();
  }
  function uploadItem(key, rec, tabId, item){
    if (item.status === 'done' && item.att) return Promise.resolve(item.att);
    item.status = 'uploading'; item.error = null;
    var meta = metaFor(item, rec, tabId, key);
    var p = (item.size <= SMALL_BYTES && !item.uploadUrl) ? legacyUpload(meta, item) : resumableUpload(meta, item);
    return p.then(function(att){ item.status = 'done'; item.att = att; return att; },
      function(e){
        if (String(e && e.message) === 'canceled'){ item.status = 'canceled'; throw e; }
        item.status = 'error'; item.error = String(e && e.message || e);
        throw e;
      });
  }
  function cancelItem(key, item){
    item.canceled = true;
    if (item.xhr){ try { item.xhr.abort(); } catch(e){} }
    if (item.uploadUrl || item.attachmentId){
      relay('cancelUpload', { uploadUrl: item.uploadUrl, attachmentId: item.attachmentId }).catch(function(){});
    }
    pend[key] = (pend[key] || []).filter(function(x){ return x.uid !== item.uid; });
    renderSection();
  }

  /* ---------- voice recorder (record → preview → attach) ---------- */
  function pickMime(list){
    if (!(window.MediaRecorder && MediaRecorder.isTypeSupported)) return '';
    for (var i = 0; i < list.length; i++) if (MediaRecorder.isTypeSupported(list[i])) return list[i];
    return '';
  }
  function startRec(key){
    if (REC.state !== 'idle'){ notify('Finish the current recording first', 'err'); return; }
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder)){
      notify('Voice recording is not supported in this browser', 'err'); return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
      var mime = pickMime(['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus']);
      REC = { state:'rec', key:key, stream:stream, chunks:[], t0:Date.now(), mime:mime, timer:null, blob:null, url:null, dur:0 };
      var mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
      REC.mr = mr;
      mr.ondataavailable = function(e){ if (e.data && e.data.size) REC.chunks.push(e.data); };
      mr.onstop = function(){
        stream.getTracks().forEach(function(t){ t.stop(); });
        if (REC.timer) clearInterval(REC.timer);
        if (REC.state === 'canceling'){ REC = { state:'idle' }; renderSection(); return; }
        var blob = new Blob(REC.chunks, { type: mime || 'audio/webm' });
        REC.blob = blob; REC.dur = Math.round((Date.now() - REC.t0) / 1000);
        REC.url = URL.createObjectURL(blob); REC.state = 'preview';
        renderSection();
      };
      mr.start(250);
      REC.timer = setInterval(function(){
        var el = byId('tcRecT'); if (el) el.textContent = fmtDur((Date.now() - REC.t0) / 1000);
        if (Date.now() - REC.t0 > 10 * 60 * 1000) stopRec();   /* 10-minute cap */
      }, 500);
      renderSection();
    }).catch(function(e){ notify('Microphone blocked: ' + (e.message || e), 'err'); });
  }
  function stopRec(){ if (REC.mr && REC.state === 'rec'){ try { REC.mr.stop(); } catch(e){} } }
  function cancelRec(){
    if (REC.state === 'rec'){ REC.state = 'canceling'; try { REC.mr.stop(); } catch(e){} return; }
    if (REC.url) URL.revokeObjectURL(REC.url);
    REC = { state:'idle' }; renderSection();
  }
  function attachRec(key){
    if (!(REC.state === 'preview' && REC.blob)) return;
    var ext = /mp4/.test(REC.mime) ? 'm4a' : /ogg/.test(REC.mime) ? 'ogg' : 'webm';
    var stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    var f;
    try { f = new File([REC.blob], 'voice-' + stamp + '.' + ext, { type: REC.blob.type }); }
    catch(e){ f = REC.blob; f.name = 'voice-' + stamp + '.' + ext; }
    addPend(key, f, 'voice', REC.dur);
    if (REC.url) URL.revokeObjectURL(REC.url);
    REC = { state:'idle' };
    renderSection();
  }

  /* ---------- attachment + pipeline rendering ---------- */
  function attList(m){
    var a = m && m.attachments;
    if (!a) return [];
    if (typeof a === 'string'){ try{ a = JSON.parse(a); }catch(e){ return []; } }
    return Array.isArray(a) ? a : [];
  }
  function pipeHtml(a){
    var aid = a && a.attachment_id;
    if (!aid) return '';
    var rep = TC.repByAtt[aid];
    if (rep){
      return '<button type="button" class="tc-pipe rdy" data-rep="' + escTC(aid) + '">\uD83D\uDCCB Report \u00b7 ' + (rep.status === 'approved' ? 'approved \u2713' : 'draft') + '</button>';
    }
    var pr = TC.procByAtt[aid];
    if (pr){
      if (pr.status === 'failed') return '<button type="button" class="tc-pipe err" data-retry="' + escTC(aid) + '" title="' + escTC(pr.error || '') + '">\u26A0\uFE0F Transcript failed \u2014 retry</button>';
      if (pr.status !== 'completed') return '<span class="tc-pipe">\u23F3 Transcribing\u2026</span>';
    }
    return '';
  }
  function attHtml(m){
    var atts = attList(m);
    if (!atts.length) return '';
    return atts.map(function(a){
      var id = String((a && a.file_id) || '').replace(/[^A-Za-z0-9_-]/g, '');
      if (!id) return '';
      var view = 'https://drive.google.com/file/d/' + id + '/view';
      var nm = String((a && a.name) || 'file');
      var kind = a.kind || (/^image\//i.test(String(a.mime_type || '')) ? 'image' : /^video\//i.test(String(a.mime_type || '')) ? 'video' : /^audio\//i.test(String(a.mime_type || '')) ? 'voice' : 'file');
      var extra = pipeHtml(a);
      if (kind === 'image'){
        return '<a class="tc-att-img" href="' + view + '" target="_blank" rel="noopener" title="' + escTC(nm) + '"><img src="https://drive.google.com/thumbnail?id=' + id + '&amp;sz=w480" alt="' + escTC(nm) + '" loading="lazy"></a>' + extra;
      }
      if (kind === 'voice'){
        return '<div id="tcVc_' + id + '"><button type="button" class="tc-voice" data-fid="' + id + '">\u25B6 Voice note' + (a.duration ? ' \u00b7 ' + fmtDur(a.duration) : '') + '</button></div>' + extra;
      }
      if (kind === 'video'){
        return '<a class="tc-att" href="https://drive.google.com/file/d/' + id + '/preview" target="_blank" rel="noopener" title="Opens the Drive player">\uD83C\uDFA5 ' + escTC(nm) + '</a>' + extra;
      }
      return '<a class="tc-att" href="' + view + '" target="_blank" rel="noopener">' + CLIP + ' ' + escTC(nm) + '</a>' + extra;
    }).join('');
  }
  function playVoice(btn, fid){
    var host = byId('tcVc_' + fid);
    function mount(url){ if (host) host.innerHTML = '<audio controls autoplay src="' + url + '"></audio>'; }
    if (mediaCache[fid]){ mount(mediaCache[fid]); return; }
    btn.disabled = true; btn.textContent = 'Loading\u2026';
    relay('fetchMedia', { fileId: fid }).then(function(j){
      var bin = atob(j.base64), arr = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([arr], { type: j.mime || 'audio/webm' }));
      mediaCache[fid] = url;
      mount(url);
    }).catch(function(e){
      btn.disabled = false; btn.textContent = '\u25B6 Voice note';
      notify('Could not load the voice note: ' + (e.message || e), 'err');
    });
  }

  /* ---------- report modal ---------- */
  var REP_FIELDS = [['observations','Observations'],['deficiencies','Deficiencies'],['corrections','Corrections'],['materials_actions','Materials / Actions'],['follow_ups','Follow-up items']];
  function closeReport(){ var ov = byId('tcRepOv'); if (ov) ov.remove(); }
  function openReport(aid, key){
    var rep = TC.repByAtt[aid]; if (!rep) return;
    var pr = TC.procByAtt[aid] || null;
    closeReport();
    var canApprove = myRole() === 'admin' || myRole() === 'back_office';
    var html = '<div class="card">' +
      '<h3>\uD83D\uDCCB Field report \u00b7 #' + escTC(rep.record_id) + '</h3>' +
      '<div class="sub">' + (rep.record_name ? escTC(rep.record_name) + ' \u00b7 ' : '') +
        (rep.status === 'approved' ? 'Approved' + (rep.reviewed_by ? ' by ' + escTC(rep.reviewed_by) : '') : 'Draft \u2014 review and edit before approving') +
        (rep.edited_by ? ' \u00b7 last edit ' + escTC(rep.edited_by) : '') + '</div>';
    REP_FIELDS.forEach(function(f){
      html += '<label>' + f[1] + '</label><textarea id="tcRf_' + f[0] + '">' + escTC(rep[f[0]] || '') + '</textarea>';
    });
    if (pr && pr.transcript) html += '<details><summary>Transcript</summary><pre>' + escTC(pr.transcript) + '</pre></details>';
    html += '<div class="btns">' +
      '<button type="button" class="b-sec" id="tcRepClose">Close</button>' +
      '<button type="button" class="b-sec" id="tcRepSave">Save draft</button>' +
      (canApprove ? '<button type="button" class="b-pri" id="tcRepAppr">' + (rep.status === 'approved' ? 'Back to draft' : 'Approve') + '</button>' : '') +
      '</div></div>';
    var ov = document.createElement('div');
    ov.id = 'tcRepOv'; ov.innerHTML = html;
    document.body.appendChild(ov);
    ov.addEventListener('click', function(ev){ if (ev.target === ov) closeReport(); });
    byId('tcRepClose').addEventListener('click', closeReport);
    function collect(){
      var patch = {};
      REP_FIELDS.forEach(function(f){ patch[f[0]] = byId('tcRf_' + f[0]).value; });
      return patch;
    }
    function save(extra, label){
      var patch = Object.assign(collect(), extra || {});
      return sb.from('ai_reports').update(patch).eq('id', rep.id).select().single().then(function(res){
        if (res.error) throw res.error;
        TC.repByAtt[aid] = res.data;
        notify(label || 'Report saved');
        closeReport(); renderSection();
      }).catch(function(e){ notify('Could not save: ' + (e.message || e), 'err'); });
    }
    byId('tcRepSave').addEventListener('click', function(){ save(null, 'Draft saved'); });
    var ap = byId('tcRepAppr');
    if (ap) ap.addEventListener('click', function(){
      var toApproved = rep.status !== 'approved';
      save({ status: toApproved ? 'approved' : 'draft' }, toApproved ? 'Report approved \u2713' : 'Moved back to draft');
    });
  }

  /* ---------- pipeline polling (only while the thread is open and something is cooking) ---------- */
  function schedulePipePoll(key){
    if (pipeTimer) clearTimeout(pipeTimer);
    var active = false;
    (TC.msgs[key] || []).forEach(function(m){
      attList(m).forEach(function(a){
        var p = a.attachment_id && TC.procByAtt[a.attachment_id];
        if (p && ['queued','uploading_to_ai','transcribing'].indexOf(p.status) >= 0) active = true;
      });
    });
    if (!active) return;
    pipeTimer = setTimeout(function(){
      if (currentDrawerKey() !== key) return;
      loadPipeline(key).then(function(){ renderSection(); schedulePipePoll(key); });
    }, 10000);
  }

  /* ---------- send ---------- */
  function doInsert(rec, tabId, key0, body, atts){
    var row = {
      record_type: tabId === 'tracker' ? 'job' : 'quote',
      record_id: key0,
      record_name: String((rec.cells && rec.cells[1]) || ''),
      sender_name: TC.me.display_name,
      sender_email: TC.me.email,
      body: body,
      mentions: parseMentions(body, key0)
    };
    if (atts && atts.length) row.attachments = atts;
    return sb.from('team_chat_messages').insert(row).select().single().then(function(res){
      if (res.error) throw res.error;
      var m = res.data, k = row.record_id;
      TC.msgs[k] = TC.msgs[k] || [];
      if (!TC.msgs[k].some(function(x){ return x.id === m.id; })) TC.msgs[k].push(m);
      TC.recent.unshift(m);
      return m;
    });
  }
  function sendMsg(rec, tabId){
    var ta = byId('tcInput');
    if (!ta || !TC.me) return;
    var key0 = String(rec.key);
    if (sending[key0]){ notify('Still sending \u2014 one moment', 'err'); return; }
    var items = (pend[key0] || []).filter(function(i){ return i.status !== 'canceled'; });
    var body = ta.value.trim();
    if (!body && !items.length) return;
    var isNew = isNewConv(key0);
    var selected = null;
    if (isNew){
      var sel = TC.newSel[key0] || new Set([TC.me.email]);
      sel.add(TC.me.email);
      selected = Array.from(sel);
    }
    sending[key0] = true;
    renderSection();
    var chain = Promise.resolve();
    if (isNew && selected){
      var rows = selected.map(function(em){
        return { record_type: tabId === 'tracker' ? 'job' : 'quote', record_id: key0, user_email: em, added_by: TC.me.email };
      });
      chain = chain.then(function(){
        return sb.from('conversation_participants').insert(rows).then(function(res){
          if (res.error && String(res.error.code) !== '23505') throw res.error;
          return loadParts(key0);
        });
      });
    }
    items.forEach(function(i){ if (i.status === 'error') i.status = 'ready'; });
    chain.then(function(){
      var atts = [];
      return items.reduce(function(p, item){
        return p.then(function(){ return uploadItem(key0, rec, tabId, item).then(function(a){ atts.push(a); }); });
      }, Promise.resolve()).then(function(){ return atts; });
    }).then(function(atts){
      return doInsert(rec, tabId, key0, body, atts);
    }).then(function(){
      pend[key0] = [];
      drafts[key0] = '';
      sending[key0] = false;
      var taNow = byId('tcInput');
      if (taNow && lastRenderKey === key0) taNow.value = '';   /* never wipe another record's textarea */
      delete TC.newSel[key0];
      loadParts(key0).then(function(){ renderSection(); });
      renderSection(); markRead(key0);
    }).catch(function(e){
      sending[key0] = false;
      if (String(e && e.message) !== 'canceled') notify('Message failed: ' + (e.message || e), 'err');
      renderSection();   /* draft text, finished uploads, and failed items are all kept for retry — just press Send again */
    });
  }

  /* ---------- participants UI actions ---------- */
  function addParticipant(key, tabId, email){
    var row = { record_type: tabId === 'tracker' ? 'job' : 'quote', record_id: key, user_email: email, added_by: TC.me.email };
    sb.from('conversation_participants').insert(row).then(function(res){
      if (res.error) throw res.error;
      return loadParts(key);
    }).then(function(){ notify('Added to the conversation'); renderSection(); })
      .catch(function(e){ notify('Could not add: ' + (e.message || e), 'err'); });
  }
  function removeParticipant(key, email){
    var leaving = TC.me && email === TC.me.email;
    var name = email;
    TC.roster.forEach(function(m){ if (m.email === email) name = m.display_name; });
    if (!window.confirm(leaving ? 'Leave this conversation? You will lose access to it.' : 'Remove ' + name + ' from this conversation?')) return;
    sb.from('conversation_participants')['delete']().eq('record_id', key).eq('user_email', email).then(function(res){
      if (res.error) throw res.error;
      return loadParts(key);
    }).then(function(){
      if (leaving && !canSeeAll()){ delete TC.msgs[key]; delete TC.parts[key]; }
      renderSection();
    }).catch(function(e){ notify('Could not remove: ' + (e.message || e), 'err'); });
  }

  /* ---------- realtime ---------- */
  function subscribe(){
    if (TC.channel) return;
    TC.channel = sb.channel('team-chat')
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'team_chat_messages' }, function(payload){
        var m = payload["new"]; if (!m || !TC.me) return;
        if (!TC.recent.some(function(x){ return x.id === m.id; })) TC.recent.unshift(m);
        if (TC.msgs[m.record_id] && !TC.msgs[m.record_id].some(function(x){ return x.id === m.id; })) TC.msgs[m.record_id].push(m);
        var dr = byId('drawer');
        if (dr && dr.classList.contains('on') && currentDrawerKey() === m.record_id){
          markRead(m.record_id, true); renderSection();
        } else if (m.sender_email !== TC.me.email){
          computeUnread(); refreshBadges();
          if (mentionsMe(m)) notify('\uD83D\uDCAC ' + m.sender_name + ' mentioned you on #' + m.record_id, 'ok');
        }
      })
      .subscribe();
  }

  /* ---------- UI ---------- */
  function currentDrawerKey(){
    try{
      var r = (window.rowByUid && window.state) ? window.rowByUid(window.state.drawerUid) : null;
      return r ? String(r.key) : null;
    }catch(e){ return null; }
  }
  function findByKey(key, preferTab){
    if (!(window.state && window.state.data)) return null;
    var hit = null;
    var tabs = (window.TABS || []).slice();
    if (preferTab) tabs.sort(function(a, b){ return (b.id === preferTab ? 1 : 0) - (a.id === preferTab ? 1 : 0); });
    tabs.forEach(function(t){
      if (hit) return;
      (window.state.data[t.id] || []).forEach(function(r){ if (!hit && String(r.key) === String(key)) hit = r; });
    });
    return hit;
  }
  function bodyHtml(m){
    var b = escTC(m.body);
    TC.roster.forEach(function(mm){
      b = b.replace(new RegExp('@' + reName(mm.display_name), 'gi'), function(s){ return '<span class="tc-mention">' + escTC(s) + '</span>'; });
    });
    return b;
  }
  function threadHtml(key){
    if (TC.threadErr[key]) return '<div class="tc-note">Couldn\u2019t load messages \u2014 <a href="#" id="tcRetryThread">retry</a></div>';
    var list = TC.msgs[key];
    if (!list){
      if (!TC.threadLoading[key]) loadThread(key).then(function(){ renderSection(); markRead(key); schedulePipePoll(key); });
      return '<div class="tc-note">Loading\u2026</div>';
    }
    if (!list.length && isNewConv(key)) return '';
    if (!list.length) return '<div class="tc-note">No messages yet \u2014 start the thread.</div>';
    return '<div class="tc-thread" id="tcThread">' + list.map(function(m){
      var mine = TC.me && m.sender_email === TC.me.email;
      return '<div class="tc-b ' + (mine ? 'tc-mine' : 'tc-them') + '">' +
        (mine ? '' : '<div class="tc-meta">' + escTC(m.sender_name) + ' \u00b7 ' + fmtT(m.created_at) + '</div>') +
        bodyHtml(m) + attHtml(m) +
        (mine ? '<div class="tc-meta" style="text-align:right;margin:2px 0 0">' + fmtT(m.created_at) + '</div>' : '') +
        '</div>';
    }).join('') + '</div>';
  }
  function partsHtml(key){
    if (isNewConv(key)) return '';
    var mem = partMembers(key);
    if (!mem.length && TC.parts[key] == null) return '';
    var manage = canManage(key);
    var html = '<div class="tc-parts">\uD83D\uDC65 ';
    html += mem.map(function(m){
      var removable = manage || (TC.me && m.email === TC.me.email);
      return '<span class="tc-part">' + escTC(m.display_name) +
        (removable ? '<button type="button" data-rm="' + escTC(m.email) + '" title="' + (TC.me && m.email === TC.me.email ? 'Leave the conversation' : 'Remove') + '">\u2715</button>' : '') + '</span>';
    }).join('');
    if (manage){
      var outsiders = TC.roster.filter(function(m){ return !mem.some(function(x){ return x.email === m.email; }); });
      if (outsiders.length) html += '<button type="button" class="tc-addp" id="tcAddP">+ Add</button>';
      if (addOpen === key && outsiders.length){
        html += '<span class="tc-addlist">' + outsiders.map(function(m){

        }).join('') + '</span>';

    return html;

  var addOpen = null;
  function newConvHtml(key){
    if (!isNewConv(key)) return '';
    if (!TC.newSel[key]){ TC.newSel[key] = new Set([TC.me.email]); }

  function pendHtml(key){
    var items = pend[key] || [];
    if (!items.length) return '';

      var right = i.status === 'uploading'
        ? '<span class="tc-pend-s" id="tcPs_' + i.uid + '">' + i.pct + '%</span><button type="button" data-cx="' + i.uid + '" title="Cancel upload">\u2715</button>'

      return '<div class="tc-pend">' + icon + ' <span class="tc-pend-n">' + escTC(i.name) + '</span>' +

        '<div class="tc-pbar"' + (i.status === 'uploading' ? ' style="display:block"' : '') + '><i id="tcPb_' + i.uid + '" style="width:' + i.pct + '%"></i></div>' +
        (i.error ? '<div class="tc-pend-err">' + escTC(i.error) + ' \u2014 press Send to retry</div>' : '') +
        '</div>';

  function recHtml(key){
    if (REC.state === 'rec' && REC.key === key){
      return '<div class="tc-rec"><span class="dot"></span><b id="tcRecT">0:00</b> Recording\u2026 <button type="button" id="tcRecStop">Stop</button><button type="button" id="tcRecX">Cancel</button><span class="tc-note" style="flex-basis:100%;margin:0">Transcribed by AI (Google Gemini) \u2014 skip access codes, payment info, and private conversations.</span></div>';
    }
    if (REC.state === 'preview' && REC.key === key){
      return '<div class="tc-rec">\uD83C\uDFA4 <audio controls src="' + REC.url + '"></audio><span>' + fmtDur(REC.dur) + '</span><button type="button" id="tcRecAdd">Attach</button><button type="button" id="tcRecX">Discard</button></div>';
    }
    return '';
  }
  var vidMenuOpen = false;
  function renderSection(){
    var dr = byId('drawer'); if (!dr || !dr.classList.contains('on')) return;
    var body = byId('dBody'); if (!body) return;
    var r = null;
    try{ r = window.rowByUid(window.state.drawerUid); }catch(e){}
    if (!r) return;
    var tab = null;
    try{ tab = window.tabOfUid ? window.tabOfUid(r.uid) : null; }catch(e){}
    var tabId = tab ? tab.id : 'quotes';
    var key = String(r.key);
    var prevTa = byId('tcInput');
    if (prevTa && lastRenderKey) drafts[lastRenderKey] = prevTa.value;
    lastRenderKey = key;
    var draftVal = drafts[key] || '';

    var sec = byId('teamChatSec');
    if (!sec){
      sec = document.createElement('div'); sec.className = 'd-sec'; sec.id = 'teamChatSec';
      var anchor = null;
      body.querySelectorAll('.d-sec h3').forEach(function(h){ if (/^details$/i.test(h.textContent.trim())) anchor = h.closest('.d-sec'); });
      if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(sec, anchor.nextSibling);
      else body.appendChild(sec);
    }

    var n = TC.unread[key] || 0;
    var html = '<h3>\uD83D\uDCAC Team chat' + (n ? ' <span class="badge b-red" style="margin-left:4px">' + n + ' new</span>' : '') + '</h3>';

    if (!TC.session){
      html += '<div class="tc-note" style="margin:0 0 8px">Sign in once to send and read internal team messages on this record.</div><div id="tcGsi"></div>';
      sec.innerHTML = html;
      var g = byId('tcGsi'); if (g) mountGoogleButton(g);
      return;
    }
    if (!TC.me){
      if (TC.rosterErr){
        html += '<div class="tc-note">Couldn\u2019t load the team roster \u2014 <a href="#" id="tcRetryRoster">retry</a></div>';
        sec.innerHTML = html;
        var rr = byId('tcRetryRoster'); if (rr) rr.addEventListener('click', function(ev){ ev.preventDefault(); afterSignIn(); });
        return;
      }
      html += '<div class="tc-note">' + escTC(String((TC.session.user || {}).email || 'This account')) + ' isn\u2019t on the team roster, so chat is hidden. Ask Carlos to add you. <a href="#" id="tcOut">Use a different account</a></div>';
      sec.innerHTML = html;
      var o = byId('tcOut'); if (o) o.addEventListener('click', function(ev){ ev.preventDefault(); sb.auth.signOut(); });
      return;
    }

    html += partsHtml(key);
    html += threadHtml(key);
    html += newConvHtml(key);
    var dashEmail = (window.state && window.state.email) ? String(window.state.email).toLowerCase() : '';
    if (dashEmail && dashEmail !== TC.me.email){
      html += '<div class="tc-note" style="color:var(--amber)">Sending is paused: the dashboard is signed in as ' + escTC(dashEmail) + ' but chat is signed in as ' + escTC(TC.me.display_name) + ' (' + escTC(TC.me.email) + '). <a href="#" id="tcOut">Sign out of chat</a>, then sign back in with the matching account.</div>';
    } else {
      var mentionables = partMembers(key).filter(function(m){ return m.email !== TC.me.email; });
      if (isNewConv(key)) mentionables = [];
      if (mentionables.length){
        html += '<div class="tc-chips">' + mentionables
          .map(function(m){ return '<button type="button" class="tc-chip" data-n="' + escTC(m.display_name) + '">@' + escTC(m.display_name) + '</button>'; })
          .join('') + '</div>';
      }
      html += pendHtml(key);
      html += recHtml(key);
      var busy = !!sending[key];
      html += '<div class="tc-send">' +
        (UPLOAD_URL ?
          '<button type="button" class="tc-attach" id="tcAttach" title="Attach photos or files" aria-label="Attach photos or files"' + (busy ? ' disabled' : '') + '>' + CLIP + '</button>' +
          '<button type="button" class="tc-attach" id="tcMic" title="Record a voice note" aria-label="Record a voice note"' + (busy || REC.state !== 'idle' ? ' disabled' : '') + '>' + MIC + '</button>' +
          '<span class="tc-menu"><button type="button" class="tc-attach" id="tcVid" title="Add a video walkthrough" aria-label="Add a video walkthrough"' + (busy ? ' disabled' : '') + '>' + CAM + '</button>' +
          (vidMenuOpen ? '<span class="tc-pop" id="tcVidPop"><button type="button" id="tcVidRec">\uD83C\uDFA5 Record walkthrough</button><button type="button" id="tcVidUp">\uD83D\uDCC1 Upload existing video</button><span class="tc-note" style="display:block;padding:2px 12px 8px;margin:0">Walkthroughs are transcribed by AI (Google Gemini) \u2014 skip access codes and private info.</span></span>' : '') + '</span>' +
          '<input type="file" id="tcFile" multiple style="display:none">' +
          '<input type="file" id="tcVidCap" accept="video/*" capture="environment" style="display:none">' +
          '<input type="file" id="tcVidPick" accept="video/*" style="display:none">'
          : '') +
        '<textarea id="tcInput" rows="1" placeholder="Message the team about #' + escTC(key) + '\u2026"' + (busy ? ' disabled' : '') + '></textarea>' +
        '<button type="button" id="tcSend"' + (busy ? ' disabled' : '') + '>' + (busy ? 'Sending\u2026' : 'Send') + '</button></div>';
      html += '<div class="tc-note" style="display:flex;justify-content:space-between;gap:8px"><span>Only participants see this thread. They get an email alert; @mentions also ping Google Chat.</span><a href="#" id="tcOut">Sign out</a></div>';
    }
    sec.innerHTML = html;
    var taKeep = byId('tcInput');
    if (taKeep && draftVal) taKeep.value = draftVal;

    var out = byId('tcOut');
    if (out) out.addEventListener('click', function(ev){ ev.preventDefault(); sb.auth.signOut(); });
    var rt = byId('tcRetryThread');
    if (rt) rt.addEventListener('click', function(ev){ ev.preventDefault(); delete TC.threadErr[key]; delete TC.msgs[key]; renderSection(); });
    var th = byId('tcThread'); if (th) th.scrollTop = th.scrollHeight;
    sec.querySelectorAll('.tc-chip[data-n]').forEach(function(c){
      c.addEventListener('click', function(){
        var ta = byId('tcInput'); if (!ta) return;
        ta.value = (ta.value ? ta.value.replace(/\s*$/, ' ') : '') + '@' + c.dataset.n + ' ';
        ta.focus();
      });
    });
    sec.querySelectorAll('.tc-part button[data-rm]').forEach(function(b){
      b.addEventListener('click', function(){ removeParticipant(key, b.dataset.rm); });
    });
    var apBtn = byId('tcAddP');
    if (apBtn) apBtn.addEventListener('click', function(){ addOpen = addOpen === key ? null : key; renderSection(); });
    sec.querySelectorAll('.tc-chip[data-add]').forEach(function(b){
      b.addEventListener('click', function(){ addOpen = null; addParticipant(key, tabId, b.dataset.add); });
    });
    sec.querySelectorAll('.tc-nsel').forEach(function(cb){
      cb.addEventListener('change', function(){
        var s = TC.newSel[key];
        if (cb.checked) s.add(cb.dataset.em); else s['delete'](cb.dataset.em);
      });
    });
    sec.querySelectorAll('.tc-voice[data-fid]').forEach(function(b){
      b.addEventListener('click', function(){ playVoice(b, b.dataset.fid); });
    });
    sec.querySelectorAll('.tc-pipe[data-rep]').forEach(function(b){
      b.addEventListener('click', function(){ openReport(b.dataset.rep, key); });
    });
    sec.querySelectorAll('.tc-pipe[data-retry]').forEach(function(b){
      b.addEventListener('click', function(){
        b.disabled = true;
        relay('requestTranscription', { attachmentId: b.dataset.retry })
          .then(function(){ notify('Transcription requeued'); return loadPipeline(key); })
          .then(function(){ renderSection(); schedulePipePoll(key); })
          .catch(function(e){ b.disabled = false; notify('Retry failed: ' + (e.message || e), 'err'); });
      });
    });
    var sendBtn = byId('tcSend');
    if (sendBtn) sendBtn.addEventListener('click', function(){ sendMsg(r, tabId); });
    var ta2 = byId('tcInput');
    if (ta2) ta2.addEventListener('keydown', function(ev){
      if (ev.key === 'Enter' && !ev.shiftKey && !('ontouchstart' in window)){ ev.preventDefault(); sendMsg(r, tabId); }
    });
    if (ta2) ta2.addEventListener('input', function(){ drafts[key] = ta2.value; });   /* draft saved on every keystroke — survives any re-render */
    var ab = byId('tcAttach'), fi = byId('tcFile');
    if (ab && fi){
      ab.addEventListener('click', function(){ fi.click(); });
      fi.addEventListener('change', function(){
        Array.prototype.forEach.call(fi.files || [], function(f){ addPend(key, f, null, null); });
        fi.value = '';
      });
    }
    var mic = byId('tcMic');
    if (mic) mic.addEventListener('click', function(){ startRec(key); });
    var recStop = byId('tcRecStop'); if (recStop) recStop.addEventListener('click', stopRec);
    var recX = byId('tcRecX'); if (recX) recX.addEventListener('click', cancelRec);
    var recAdd = byId('tcRecAdd'); if (recAdd) recAdd.addEventListener('click', function(){ attachRec(key); });
    var vb = byId('tcVid');
    if (vb) vb.addEventListener('click', function(){ vidMenuOpen = !vidMenuOpen; renderSection(); });
    var vr = byId('tcVidRec'), vu = byId('tcVidUp'), vc = byId('tcVidCap'), vp = byId('tcVidPick');
    if (vr && vc) vr.addEventListener('click', function(){ vidMenuOpen = false; vc.click(); });
    if (vu && vp) vu.addEventListener('click', function(){ vidMenuOpen = false; vp.click(); });
    [vc, vp].forEach(function(inp){
      if (!inp) return;
      inp.addEventListener('change', function(){
        var f = inp.files && inp.files[0];
        if (f) addPend(key, f, 'video', null);
        inp.value = '';
        vidMenuOpen = false;
      });
    });
    sec.querySelectorAll('.tc-pend button[data-cx]').forEach(function(b){
      b.addEventListener('click', function(){
        var it = (pend[key] || []).find(function(x){ return String(x.uid) === b.dataset.cx; });
        if (it) cancelItem(key, it);
      });
    });
    if (TC.msgs[key]){ markRead(key); schedulePipePoll(key); }
  }

  /* ---------- badges (attention bar chip + list-row badge) ---------- */
  var lastBadgeSig = '';
  function refreshBadges(){
    if (typeof window.renderSummary === 'function'){ try{ window.renderSummary(); }catch(e){} }
    var sig = JSON.stringify(TC.unread);
    if (sig !== lastBadgeSig){
      lastBadgeSig = sig;
      if (typeof window.renderContent === 'function'){ try{ window.renderContent(); }catch(e){} }
    }
  }
  /* ---- v0.51: unread popover -------------------------------------------
     The old pill click opened the first unread thread it could find in the
     active tabs and did NOTHING when the record had been archived — the
     common case, since chats go quiet after jobs are paid. This list makes
     every unread thread reachable: active records open their drawer,
     archived ones are labelled and can be marked read. */
  var tcPop = null;
  function closeTcPop(){
    if (tcPop && window.BackNav) window.BackNav.closed('tcpop');
    if (tcPop && tcPop.parentNode) tcPop.parentNode.removeChild(tcPop);
    tcPop = null;
    document.removeEventListener('click', onTcPopDoc, true);
    document.removeEventListener('keydown', onTcPopKey, true);
    window.removeEventListener('scroll', closeTcPop, true);
  }
  function onTcPopDoc(ev){ if (tcPop && !tcPop.contains(ev.target)) closeTcPop(); }
  function onTcPopKey(ev){ if (ev.key === 'Escape') closeTcPop(); }
  function unreadThreads(){
    var latest = {};
    TC.recent.forEach(function(m){ if (!latest[m.record_id]) latest[m.record_id] = m; }); /* recent is newest-first */
    return Object.keys(TC.unread).filter(function(k){ return TC.unread[k] > 0; }).map(function(k){
      var m = latest[k] || {};
      return { key:k, n:TC.unread[k], m:m, hit:findByKey(k, m.record_type === 'job' ? 'tracker' : 'quotes'), at:m.created_at || '' };
    }).sort(function(a, b){ return a.at < b.at ? 1 : -1; });
  }
  function toggleTcPop(anchor){
    if (tcPop){ closeTcPop(); return; }
    var items = unreadThreads();
    if (!items.length) return;
    if (window.BackNav) window.BackNav.open('tcpop', closeTcPop);
    var pop = document.createElement('div');
    pop.className = 'tc-pop';
    pop.setAttribute('role', 'menu');
    items.forEach(function(it){
      /* v0.52 — archived rows hold a Mark-read <button>, so the row itself
         must not be a button (nested interactive controls are invalid HTML
         and confuse keyboards/screen readers). Active rows stay buttons. */
      var row = document.createElement(it.hit ? 'button' : 'div');
      if (it.hit) row.type = 'button';

     holds both "0003" and "998", while a sheet row key is whatever was typed.
     Pure. */
  function normRef(v){
    var s = String(v == null ? '' : v).trim();
    if (!s) return '';

       "94" from Quotes, and "1,242" from Tracker (Sheets applies a thousands
       separator to the numeric column). Strip separators and leading zeros so
       every spelling of the same number collapses to one key — without this,
       78 of 148 Tracker rows never match their property. */

     falls back to the originating quote link. Quotes never consult accepted. */
  var TAB_SOURCES = { quotes:['quote'], tracker:['accepted','quote'] };

  window.propForRecord = function(tabId, key){

     navigation) goes through leaveDetail(), which clears the selection AND
     consumes the propsel history entry — no stale Back-button state can
     survive a tab switch. The popstate closer is defensive: it no-ops when
     nothing is selected and only re-renders when Properties is the active
     tab, so even a hypothetical stale entry cannot repaint the wrong tab. */
  function popCloseDetail(){

  function fmtRefs(rows, prefix){
    var counts = {}, order = [];
    rows.forEach(function(l){

     NOTE: this is a client-side gate. The durable fix is role-aware RLS (or a
     server component) so the rows never reach a Field session at all; that is

  function propAllowed(){

  /* ---- v0.38: unlinked-record triage -------------------------------------

     rather than guessing. */
  /* Job titles carry the address in several shapes:
       "<work> at <address>"            (most common)
       "<work> on <address>"
       "<address>, <work>"              (address leads, comma-separated)
     Anything else yields '' and is reported as "address needs review" rather
     than "new site" — mislabelling an unparsed title as new is how duplicate
     P-numbers get created. */
  function addrFromTitle(title){
    var t = String(title == null ? '' : title).trim();
    if (!t) return '';
    var low = t.toLowerCase();
    /* trailing " at " / " on " — take the LAST one, since job text often
       contains its own ("Look at the valve ... at 123 Main St") */
    var best = -1, cut = 0;
    [[' at ', 4], [' on ', 4]].forEach(function(pair){
      var i = low.lastIndexOf(pair[0]);

     links anything by itself. */
  function addrKey(a){
    var t = String(a == null ? '' : a).toUpperCase();
    t = t.split(',')[0];                                  /* drop ", Los Angeles, CA 90012" */
    t = t.replace(/\s+(CA|CALIF|CALIFORNIA)\s*\d{5}(-\d{4})?\s*$/, '');   /* trailing state+zip */
    t = t.replace(/\s+\d{5}(-\d{4})?\s*$/, '');            /* bare trailing zip */
    t = t.replace(/\b(NORTH|SOUTH|EAST|WEST)\b/g, function(w){ return w.charAt(0); });
    /* Cut at the street type: everything after it is city/state noise, which
       is often NOT comma-separated ("957 Figueroa Terrace Los Angeles CA"). */
    /* Cut at the street type: everything after it is city/state noise, which is
       often NOT comma-separated. The street type is CANONICALISED and KEPT —
       dropping it made "123 Main Avenue" an exact match for "123 Main Street". */
    var TYPES = { STREET:'ST', ST:'ST', AVENUE:'AVE', AVE:'AVE', BOULEVARD:'BLVD', BLVD:'BLVD',

                  LANE:'LN', LN:'LN', PLACE:'PL', PL:'PL', COURT:'CT', CT:'CT',

    if (!RV.length) h += '<div class="prop-meta" style="margin:0 0 8px">No checks yet \u2014 if this address and its records look right (or wrong), say so below.</div>';
    h += '<div class="rev-actions"><button id="propConfirmBtn" class="rev-btn" type="button">\u2713 Confirm address</button>' +
         '<button id="propFlagBtn" class="rev-btn rev-btn-flag" type="button">\u26A0 Flag a problem</button></div>' +
         '</div></div>';
    }
    Object.keys(bySrc).sort().forEach(function(st){
      var rows = bySrc[st];
      var label = SRC_LABEL[st] || (st.charAt(0).toUpperCase() + st.slice(1) + 's');
      h += '<div class="prop-sec"><b>' + esc(label) + '</b> <span class="cnt">(' + rows.length + ')</span>';
      if (st === 'appointment'){
        h += '<div class="prop-body">' + rows.length + ' Ember appointment' + (rows.length > 1 ? 's' : '') +
             ' on file \u2014 see Ember records below.</div>';
      } else {
        var refs = fmtRefs(rows, '#');
        h += '<div class="prop-body">' + (refs ? esc(refs) : rows.length + ' linked record' + (rows.length > 1 ? 's' : '')) + '</div>';
      }
      h += '</div>';
    });
    h += '</div>';                                   /* end left column */
    var hasRight = R.length || E.length;
    h += '<div>' + (hasRight ? '<div class="prop-colhd">Connections</div>' : '');
    if (R.length){
      h += '<div class="prop-sec"><b>Related buildings</b>' + R.map(function(r){
        var other = r.property_a === pid ? r.property_b : r.property_a;
        var op = P.byId[other] || {};
        return '<div class="prop-body"><a href="#" data-prop="' + esc(other) + '" class="prop-jump propJump">' + esc(other) + '</a> \u00b7 ' +
          esc(op.normalized_address || '') + (op.building_label ? ' (' + esc(op.building_label) + ')' : '') +
          ' \u00b7 <span style="color:#5A5F6A">' + esc(r.relationship_type.replace(/_/g, ' ')) + ', ' + esc(r.status) + '</span></div>';
      }).join('') + '</div>';
    }
    if (E.length){
      h += '<div class="prop-sec"><b>Ember records</b>' + E.map(function(e){
        return '<div class="prop-body">' + esc(e.name || e.id) + ' <span style="color:#5A5F6A">(' + esc(e.status) + ')</span></div>';
      }).join('') + '</div>';
    }
    if (!hasRight) h += '<div class="prop-body" style="color:#8A8F98;font-size:13.5px">No related buildings or Ember records linked to this property.</div>';
    h += '</div>';                                   /* end right column */
    h += '</div>';                                   /* end .prop-cols */
    h += '<div class="prop-note">Frozen property layer \u00b7 read-only \u00b7 IDs are permanent and never renumbered</div>';
    h += '</div></div>';
    return h;
  }

  /* v0.38 — the triage view. Records with no property, each with a suggested
     existing match where one is obvious. Read-only: nothing here writes. */
  function unlinkedList(){
    var rows = window.propUnlinked ? window.propUnlinked() : [];
    var h = '<div class="prop-wrap">';
    var withSugg = rows.filter(function(r){ return r.sugg; }).length;
    var noAddr   = rows.filter(function(r){ return !r.sugg && !r.addr; }).length;
    var likelyNew = rows.length - withSugg - noAddr;
    h += '<div class="prop-meta">' + rows.length + ' record' + (rows.length === 1 ? '' : 's') +
         ' with no property \u00b7 ' + withSugg + ' match an existing site \u00b7 ' +
         likelyNew + ' may be new \u00b7 ' + noAddr + ' need a closer look</div>';
    if (!rows.length){
      h += '<div class="prop-center" style="padding:18px 0;margin:0;text-align:left">Every quote and tracker record maps to a property.</div></div>';
      return h;
    }
    rows.forEach(function(r){
      h += '<div class="unl-row">' +
           '<span class="unl-src">' + esc(r.src) + '</span>' +
           '<span class="unl-num">#' + esc(r.key) + '</span>' +
           '<div style="flex:1;min-width:0">' +
             '<div class="unl-title">' + esc(r.title || '(no title)') + '</div>' +
             (r.name ? '<div class="unl-addr">' + esc(r.name) + '</div>' : '') +
             (r.addr ? '<div class="unl-addr">address in title: ' + esc(r.addr) + '</div>' : '<div class="unl-addr">no address could be read from the title</div>') +
             '<div class="unl-sugg">' +
               (r.sugg
                 ? '<span class="hit">Looks like ' + r.sugg.ids.map(esc).join(', ') + '</span>' +
                   (r.sugg.exact ? '' : ' <span style="color:#767B85">(close match)</span>') +
                   ' \u00b7 ' + r.sugg.ids.map(function(id){
                       return '<a href="#" class="prop-jump propJump" data-prop="' + esc(id) + '">open ' + esc(id) + '</a>';
                     }).join(' \u00b7 ')
                 /* Three states, not two: an unreadable title is NOT evidence of
                    a new site, and calling it one invites a duplicate P-number. */
                 : (r.addr
                     ? '<span class="miss">No existing property matches \u2014 likely a new site</span>'
                     : '<span style="color:#8A6D1F;font-weight:650">Address needs review \u2014 open the record to check</span>')) +
             '</div>' +
           '</div>' +
           '<button type="button" class="prop-back unlGo" data-tab="' + esc(r.tab) + '" data-uid="' + esc(r.uid || '') + '">Open record</button>' +
           '</div>';
    });
    h += '<div class="prop-note">Linking and creating properties happen outside the dashboard \u2014 the frozen layer stays read-only here. This list tells you what needs doing.</div>';
    h += '</div>';
    return h;
  }

  function list(){
    if (P.filter === 'unlinked') return unlinkedList();
    var rows = filtered();
    var h = '<div class="prop-wrap">';
    h += '<div class="prop-meta">' + rows.length + ' of ' + P.props.length +
         ' frozen properties \u00b7 P-0001\u2026P-0501 \u00b7 read-only</div>';
    if (!rows.length) h += '<div class="prop-center" style="padding:18px 0;margin:0;text-align:left">No properties match.</div>';
    h += '<div class="prop-grid">';
    rows.slice(0, 400).forEach(function(p){
      var pid = p.property_id, nL = (P.links[pid] || []).length;
      /* v0.61/62 — the card's top-right slot shows the latest client from
         P.custLatest (raw first row of the server-ordered relationships:
         valid_from DESC nulls-last, name ASC tiebreak — never dedupe's
         possibly-older spelling). CU below is dedupe-for-counting only.
         The freeze grade chips moved out of the list (provenance, still in
         the detail next to Address check) — except "needs review", the one
         grade that's actionable. */
      var CU = dedupeCustomers(P.custs[pid]);
      var nC = CU.length;
      h += '<div class="prop-row propRow" data-prop="' + esc(pid) + '">' +
           '<span class="prop-pid">' + esc(pid) + '</span>' +
           '<div style="flex:1;min-width:0"><div class="prop-title">' +
           esc(p.normalized_address) + (p.building_label ? ' <span class="prop-lbl">\u00b7 ' + esc(p.building_label) + '</span>' : '') +
           '</div><div class="prop-sub">' + esc(p.city || '') + (nC ? ' \u00b7 ' + nC + ' customer' + (nC > 1 ? 's' : '') : '') +
           (nL ? ' \u00b7 ' + nL + ' record' + (nL > 1 ? 's' : '') : '') + '</div>' + sysChips(pid) + '</div>' +
           (ALERTS[pid] ? '<span title="compliance alert" style="font-size:17px">\u26A0\uFE0F</span>' : '') +
           (p.confidence === 'ambiguous' ? confChip(p.confidence) : '') +
           (function(){
             var L = P.custLatest[pid];
             if (!L) return '';
             /* v0.62/63 — the label matches the evidence for the SELECTED
                row: a dated pick says "Latest customer"; an undated pick
                would say "Customer on file". After the backfill zero cards
                hit the fallback — all 11 undated rows are non-selected
                variants — but it stays as the honest path for future data. */
             return '<span class="prop-client" title="' + (L.dated ? 'Latest customer' : 'Customer on file') + '">' + esc(L.name) + '</span>';
           })() +
           '</div>';
    });
    h += '</div>';
    if (rows.length > 400) h += '<div class="prop-meta">Showing first 400 \u2014 narrow the search.</div>';
    h += '</div>';
    return h;
  }

  function sendReview(pid, verdict, note, btn){
    if (!pid || !P.session) return;
    var email = (P.session.user && P.session.user.email) || '';
    if (btn) btn.disabled = true;
    sb.from('property_reviews').insert({ property_id: pid, verdict: verdict, note: note, reviewer: email })
      .select().then(function(res){
        if (btn) btn.disabled = false;
        if (res.error){
          if (typeof window.toast === 'function') window.toast('Could not save the check: ' + (res.error.message || 'error'));
          return;
        }
        var row = (res.data && res.data[0]) || { property_id: pid, verdict: verdict, note: note, reviewer: email, created_at: new Date().toISOString() };
        grp(P.reviews, pid, row);
        if (typeof window.toast === 'function') window.toast(verdict === 'confirm' ? 'Address confirmed \u2014 thanks!' : 'Flag saved \u2014 it goes into the next freeze review.');
        renderProperties();
      });
  }

  window.renderProperties = function(){
    var main = document.getElementById('main'); if (!main) return;
    if (!propAllowed()){
      main.innerHTML = '<div class="prop-center">Properties are not available for this account.</div>';
      return;
    }
    if (!P.session){
      main.innerHTML = '<div class="prop-center">Sign in (the same Google sign-in Team Chat uses) to load the frozen property layer.</div>';
      return;
    }
    if (!P.loaded && !P.loading && !P.err) load();
    if (P.err){
      main.innerHTML = '<div class="prop-center" style="color:#9E2724">Property layer failed to load: ' + esc(P.err) +
        ' <button id="propRetry" class="prop-back" style="margin-left:8px">Retry</button></div>';
      var rb = document.getElementById('propRetry');
      if (rb) rb.addEventListener('click', function(){ P.err = null; load(); });
      return;
    }
    if (!P.loaded){
      main.innerHTML = '<div class="prop-center">Loading the property layer\u2026</div>';
      return;
    }
    main.innerHTML = P.sel ? detail(P.sel) : list();
    var back = document.getElementById('propBack');
    if (back) back.addEventListener('click', function(){ leaveDetail(true); });
    var cb = document.getElementById('propConfirmBtn');
    if (cb) cb.addEventListener('click', function(){ sendReview(P.sel, 'confirm', null, cb); });
    var fb2 = document.getElementById('propFlagBtn');
    if (fb2) fb2.addEventListener('click', function(){
      var note = window.prompt('What looks wrong? (wrong grouping, address typo, duplicate\u2026)', '');
      if (note === null) return;
      sendReview(P.sel, 'flag', note.trim() || null, fb2);
    });
    Array.prototype.forEach.call(main.querySelectorAll('.propRow,[data-prop].propJump'), function(el){
      el.addEventListener('click', function(ev){ ev.preventDefault();
        var wasOpen = !!P.sel;
        P.sel = el.getAttribute('data-prop'); renderProperties();
        /* v0.57 — one history entry per list->detail transition; property-to-
           property jumps reuse it, so back always returns to the list. */
        if (!wasOpen && window.BackNav) window.BackNav.open('propsel', popCloseDetail);
        try { window.scrollTo(0, 0); } catch(_e){} });
    });
    /* v0.38: jump from the triage list straight to the record that needs a
       property, so you can read the full job before deciding. */
    Array.prototype.forEach.call(main.querySelectorAll('.unlGo'), function(el){
      el.addEventListener('click', function(ev){
        ev.preventDefault();
        var tab = el.getAttribute('data-tab'), uid = el.getAttribute('data-uid');
        if (uid && window.switchToRecord) window.switchToRecord(tab, uid);
        else if (window.__gotoTab) window.__gotoTab(tab);
      });
    });
  };
})();
/*PROPERTIES_END*/
</script>
